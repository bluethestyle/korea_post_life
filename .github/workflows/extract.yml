name: 추출·검증

# 공시 문서를 받아 종형·특약·급부와 가입조건·결합 제약을 뽑고, 검증을 거쳐 시트에 쓴다. 원본 PDF는 저장소에도 결과물에도 남기지 않는다.
# samsungfire(삼성화재)의 급부는 모델을 부르지 않는다. 요약서의 급부 표를 규칙으로 읽고 대조 자료와의 교차 확인으로 판정해 쓴다
# (scripts/load_table_product.py). parts에 가입조건을 주면 시트에 있는 주계약의 가입나이와 가입한도만 모델로 뽑아 sys_가입조건만 바꾼다
# (extract_product.py --parts 주계약가입조건). parts를 비우면 급부만 돈다.
# meritz(메리츠화재)는 초기 적재다. 두 판독(sonnet, opus)이 판정을 마친 값 파일(data/crosscheck/meritz_*_benefits_2reader.jsonl)로
# 급부를 쓴다(scripts/load_reader_product.py). 받은 요약서에서 표를 다시 읽어 조각 지문이 같은 줄만 쓴다. 급부만 돈다.
# pdfplumber는 버전을 고정한다. 표 읽기 결과(조각 순번과 글자)가 버전에 따라 달라지면 meritz의 조각 지문과 samsungfire의 대조 자료
# 번호가 어긋난다. 두 회사의 조각과 대조 자료를 만든 버전(0.11.10)이다.
on:
  workflow_dispatch:
    inputs:
      org:
        description: "회사: epost(우체국), hanwha(한화생명), samsungfire(삼성화재, 급부는 표 규칙과 교차 확인, 가입조건은 주계약만), meritz(메리츠화재, 급부만. 두 판독 값 파일로 적재)"
        type: choice
        options: [epost, hanwha, samsungfire, meritz]
        default: epost
      only:
        description: "이 공시상품코드만 처리 (여러 개면 공백으로 구분). 비우면 전체"
        required: false
      parts:
        description: "돌릴 부분: 급부,가입조건,관문 (비우면 모두. samsungfire는 비우면 급부만, meritz는 급부만 돈다). 가입조건만 돌리면 시트의 특약을 기준으로 뽑는다(samsungfire는 주계약 가입조건만). 관문만 돌리면 관문전용 종형의 종형 행과 주계약 가입조건만 쓴다(급부는 다시 뽑지 않는다)"
        required: false
      dry_run:
        description: "시트에 쓰지 않고 흐름만 확인"
        type: boolean
        default: false
      docs_run:
        description: "이미 끝난 '공시 문서 수집' 실행 번호. 주면 공시 사이트에 다시 접속하지 않고 그 실행이 남긴 문서를 쓴다 (사이트가 막혔을 때)"
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      INPUT_ORG: ${{ inputs.org || 'epost' }}
      INPUT_ONLY: ${{ inputs.only }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_PARTS: ${{ inputs.parts }}
      INPUT_DOCS_RUN: ${{ inputs.docs_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pdfplumber==0.11.10
      - name: 공시 문서 받기
        run: |
          if [ -n "$INPUT_DOCS_RUN" ]; then
            gh run download "$INPUT_DOCS_RUN" --repo "$GITHUB_REPOSITORY" -n disclosure -D out
            test -s out/index.json
          else
            python scripts/fetch_disclosure.py --out out --org "$INPUT_ORG"
          fi
      - name: 추출·검증·기록
        run: |
          args=()
          for code in $INPUT_ONLY; do args+=(--only "$code"); done
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$INPUT_ORG" = "samsungfire" ]; then
            parts=",${INPUT_PARTS// /},"
            if [ "$parts" = ",," ]; then parts=",급부,"; fi
            ran=0
            if [[ "$parts" == *",급부,"* ]]; then
              python scripts/load_table_product.py --docs out --targets data/targets/samsungfire.json --result result/extract.json "${args[@]}"
              ran=1
            fi
            if [[ "$parts" == *",가입조건,"* ]]; then
              python scripts/extract_product.py --docs out --targets data/targets/samsungfire.json --parts 주계약가입조건 --result result/conditions.json "${args[@]}"
              ran=1
            fi
            if [ "$ran" = 0 ]; then echo "samsungfire에서 돌릴 수 있는 부분은 급부, 가입조건입니다: $INPUT_PARTS"; exit 1; fi
          elif [ "$INPUT_ORG" = "meritz" ]; then
            parts=",${INPUT_PARTS// /},"
            if [ "$parts" != ",," ] && [ "$parts" != ",급부," ]; then echo "meritz에서 돌릴 수 있는 부분은 급부입니다: $INPUT_PARTS"; exit 1; fi
            python scripts/load_reader_product.py --docs out --targets data/targets/meritz.json --result result/extract.json --rows result/rows.json "${args[@]}"
          else
            if [ -n "$INPUT_PARTS" ]; then args+=(--parts "$INPUT_PARTS"); fi
            python scripts/extract_product.py --docs out --targets "data/targets/$INPUT_ORG.json" --result result/extract.json "${args[@]}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extract-result
          path: result
          retention-days: 3

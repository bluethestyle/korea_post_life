name: 시장 소식 수집

# 매일 06:10(한국 시간)에 그날 요일의 대상만 수집한다. 일요일은 실패한 질의만 다시 돈다.
on:
  schedule:
    - cron: "10 21 * * *"
  workflow_dispatch:
    inputs:
      weekday:
        description: "요일 지정 (월=0 … 일=6). 비우면 오늘"
        required: false
      lookback_days:
        description: "수집 구간 길이(일). 비우면 14일. 처음 자료를 채울 때만 넓힘"
        required: false
      dry_run:
        description: "시트에 쓰지 않고 흐름만 확인"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      INPUT_WEEKDAY: ${{ inputs.weekday }}
      INPUT_LOOKBACK: ${{ inputs.lookback_days }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수집
        run: |
          args=()
          if [ -n "$INPUT_WEEKDAY" ]; then args+=(--weekday "$INPUT_WEEKDAY"); fi
          if [ -n "$INPUT_LOOKBACK" ]; then args+=(--lookback-days "$INPUT_LOOKBACK"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/collect_trends.py "${args[@]}"

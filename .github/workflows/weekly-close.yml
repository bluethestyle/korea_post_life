name: 주간 마감

# 일요일 23:40(한국 시간)에 시트 정본을 저장소에 사본으로 뜬다. 사본의 커밋 이력이 개정 이력이 된다.
on:
  schedule:
    - cron: "40 14 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-close
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/snapshot_sheet.py
      - name: 사본 커밋
        run: |
          if [ -z "$(git status --porcelain data/snapshot)" ]; then
            echo "바뀐 내용이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot
          git commit -m "주간 사본 $(TZ=Asia/Seoul date +%G-W%V)"
          git push

name: 표준담보 매핑

# 시트의 급부를 표준담보 사전에 잇는다. 이미 행이 있는 급부는 건너뛰고, 담당자가 정한 행은 건드리지 않는다.
on:
  workflow_dispatch:
    inputs:
      remap:
        description: "이미 행이 있는 급부도 다시 묻는다 (기본은 대기 행만)"
        type: boolean
        default: false
      remap_states:
        description: "다시 물을 검토상태를 쉼표로 (대기, 자동확정, 대상외). 비우면 대기"
        type: string
        default: ""
      remap_match:
        description: "원시급부명이 이 정규식에 맞는 자동확정·대상외 행도 다시 묻는다 (공백뿐이면 주지 않은 것으로 본다)"
        type: string
        default: ""
      skip_run:
        description: "앞 실행의 ID(gh run list에 나오는 번호). 그 실행의 결과물(mapping-result, 3일 보관)에 있는 급부는 이번에 묻지 않는다"
        type: string
        default: ""
      sync_dictionary:
        description: "매핑 전에 data/seed의 표준담보 사전을 시트 탭에 올린다 (행 추가와 사용여부 변경만)"
        type: boolean
        default: false
      prune:
        description: "시트에 더는 없는 급부의 매핑 행을 걷어낸다"
        type: boolean
        default: false
      chars_per_minute:
        description: "판정 모델에 분당 보낼 입력 글자 수 상한(호출 간격과 분당 토큰 창을 함께 정한다). 비우면 스크립트 기본값"
        type: string
        default: ""
      plan:
        description: "시트에 쓰지 않고 판정 모델도 부르지 않는다. 바뀔 것과 호출 수만 보인다"
        type: boolean
        default: false
      dry_run:
        description: "시트에 쓰지 않고 흐름만 확인 (판정 모델은 부른다)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read           # 앞 실행의 결과물을 받는다 (skip_run)

concurrency:
  group: extract
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 240      # 분당 글자 수 상한을 낮게 두면 대기 행 전체를 다시 물을 때 두 시간이 넘는다
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      INPUT_REMAP: ${{ inputs.remap }}
      INPUT_REMAP_STATES: ${{ inputs.remap_states }}
      INPUT_REMAP_MATCH: ${{ inputs.remap_match }}
      INPUT_SYNC_DICTIONARY: ${{ inputs.sync_dictionary }}
      INPUT_CHARS_PER_MINUTE: ${{ inputs.chars_per_minute }}
      INPUT_PLAN: ${{ inputs.plan }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_PRUNE: ${{ inputs.prune }}
      INPUT_SKIP_RUN: ${{ inputs.skip_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 앞 실행 결과 받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip_run="${INPUT_SKIP_RUN//[[:space:]]/}"
          if [ -n "$skip_run" ]; then
            gh run download "$skip_run" -R "$GITHUB_REPOSITORY" -n mapping-result -D previous
            test -f previous/mapping.json
          fi
      - name: 매핑
        run: |
          args=()
          if [ "$INPUT_REMAP" = "true" ]; then args+=(--remap); fi
          if [ -n "$INPUT_REMAP_STATES" ]; then args+=(--remap-states "$INPUT_REMAP_STATES"); fi
          # 정규식이 '-'로 시작해도 값으로 읽히게 '='로 붙여 넘긴다. 공백뿐인 입력은 넘기지 않는다
          if [ -n "${INPUT_REMAP_MATCH//[[:space:]]/}" ]; then args+=(--remap-match="$INPUT_REMAP_MATCH"); fi
          if [ -n "${INPUT_SKIP_RUN//[[:space:]]/}" ]; then args+=(--skip-result previous/mapping.json); fi
          if [ "$INPUT_SYNC_DICTIONARY" = "true" ]; then args+=(--sync-dictionary); fi
          if [ -n "$INPUT_CHARS_PER_MINUTE" ]; then args+=(--chars-per-minute "$INPUT_CHARS_PER_MINUTE"); fi
          if [ "$INPUT_PLAN" = "true" ]; then args+=(--plan); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$INPUT_PRUNE" = "true" ]; then args+=(--prune); fi
          python scripts/map_benefits.py --result result/mapping.json "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapping-result
          path: result
          retention-days: 3

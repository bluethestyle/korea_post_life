<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>그래프 탐색 시안</title>
<style>
:root{--bg:#eef1f4;--dot:#c3ccd6;--ink:#16202b;--ink2:#4f5d6c;--line:#8a98a8;--panel:#fbfcfd;--band:#131a22;--band2:#1f2a35;--sig:#0aa5a5;--sig2:#08797c;--sigbg:#d3f2f1;--bd:#cfd7e0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"D2Coding",monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%}
header{background:var(--band);color:#e6edf3;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px;position:relative;z-index:5;border-bottom:2px solid var(--sig)}
header h1{font-size:15px;margin:0;letter-spacing:.08em;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
header h1 i{display:inline-block;width:10px;height:10px;background:var(--sig);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
header small{color:#8fa1b3;font-size:14px}
.srch{position:relative;flex:1 1 260px;min-width:0}
.srch input{width:100%;height:38px;border:1px solid #3a4856;background:var(--band2);color:#fff;padding:0 12px;font-size:15px;outline:none;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.srch input:focus{border-color:var(--sig)}
#sugg{position:absolute;left:0;right:0;top:42px;background:#fff;color:var(--ink);border:1px solid var(--bd);box-shadow:0 10px 30px rgba(10,20,30,.25);max-height:60vh;overflow:auto;display:none;z-index:20}
#sugg button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid #edf0f3;min-height:44px}
#sugg button:hover,#sugg button.on{background:var(--sigbg)}
.kb{font-size:14px;padding:1px 6px;border:1px solid currentColor;white-space:nowrap}
.hb{display:flex;gap:6px}
.hbtn{height:38px;padding:0 12px;border:1px solid #3a4856;background:var(--band2);color:#dfe7ee;white-space:nowrap;clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,0 100%)}
.hbtn.on{border-color:var(--sig);color:#9ff0ee}
.chip:active{transform:translate(-50%,-50%) scale(.9)}
.hbtn:active,.pbtn:active,.zb button:active,.st button:active{transform:scale(.93)}
#trail{display:flex;align-items:center;gap:4px;padding:6px 12px;background:#e2e7ec;border-bottom:1px solid var(--bd);overflow-x:auto;white-space:nowrap;min-height:40px;scrollbar-width:thin}
#trail .tl{color:var(--ink2);margin-right:4px;font-weight:600;letter-spacing:.06em}
#trail button{border:1px solid var(--bd);background:#fff;padding:4px 10px;max-width:220px;overflow:hidden;text-overflow:ellipsis;min-height:30px}
#trail button.cur{border-color:var(--sig);background:var(--sigbg)}
#trail .sep{color:var(--sig2)}
main{flex:1;display:flex;min-height:0}
#cv{flex:1;position:relative;min-width:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:22px 22px}
svg#g{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#panel{width:350px;flex:none;background:var(--panel);border-left:1px solid var(--bd);overflow:auto;padding:0 0 20px}
.ph{background:var(--band2);color:#e6edf3;padding:10px 14px;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);margin-bottom:6px}
.ph .t{font-size:16px;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.ph .s{color:#9fb0c0;margin-top:4px}
.sec{padding:8px 14px}
.sec h3{font-size:14px;margin:6px 0 8px;color:var(--sig2);letter-spacing:.08em;display:flex;align-items:center;gap:6px}
.sec h3:before{content:"";width:6px;height:6px;background:var(--sig)}
table.pt{width:100%;border-collapse:collapse}
table.pt td{border-bottom:1px solid #e6ebf0;padding:6px 4px;vertical-align:top;overflow-wrap:anywhere}
table.pt td:first-child{color:var(--ink2);width:38%}
.pbtn{display:block;width:100%;text-align:left;margin:0 0 6px;padding:10px 12px;border:1px solid var(--sig);background:#fff;color:var(--sig2);font-weight:600;min-height:44px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.pbtn.dark{background:var(--band2);color:#bff5f3;border-color:var(--band2)}
.pbtn:disabled{opacity:.45}
.el{display:flex;gap:6px;align-items:center;width:100%;border:0;border-bottom:1px solid #e9edf1;background:none;text-align:left;padding:7px 2px;min-height:40px}
.el span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--ink2)}
#chips{position:absolute;inset:0;pointer-events:none}
.chip{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);height:32px;padding:0 11px;border:1px solid var(--band2);background:#fff;font-weight:600;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.chip b{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--sig2);margin-left:4px}
.chip.done{background:#e4e9ee;color:var(--ink2)}
.chip.fold{background:var(--band2);color:#fff}
.chip.fold b{color:#8ff}
.motion .chip{animation:pop .28s cubic-bezier(.2,1.4,.5,1) both}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}}
#filt{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;z-index:3}
#filt>*{pointer-events:auto}
.fc{height:32px;padding:0 10px;border:1px solid var(--bd);background:rgba(255,255,255,.92);display:flex;align-items:center;gap:6px}
.fc.off{opacity:.45;text-decoration:line-through}
.fc i{width:10px;height:10px;display:inline-block}
#ftog{background:var(--band2);color:#fff;border-color:var(--band2)}
.zb{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zb button{width:44px;height:44px;border:1px solid var(--band2);background:#fff;font-size:18px;font-weight:700}
.zb button.fit{font-size:14px}
#mini{position:absolute;left:10px;bottom:10px;width:160px;height:110px;background:rgba(255,255,255,.9);border:1px solid var(--band2);z-index:3;touch-action:none}
.st{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));background:#fff;border:1px solid var(--bd);box-shadow:0 14px 40px rgba(10,20,30,.18);padding:18px;z-index:4;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.st h2{margin:0 0 4px;font-size:18px}
.st p{margin:0 0 12px;color:var(--ink2)}
.st .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.st button{min-height:44px;padding:0 14px;border:1px solid var(--band2);background:#fff;font-weight:600;display:flex;align-items:center;gap:8px}
.st .lab{font-size:14px;color:var(--sig2);font-weight:700;letter-spacing:.06em;margin-bottom:6px}
#toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:var(--band);color:#fff;padding:8px 14px;z-index:6;display:none;border-left:3px solid var(--sig)}
/* svg */
.nd .lbl{font-size:var(--fs,14px);fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.nd .cnt,.nd .bdg{font-size:14px;font-weight:700;pointer-events:none;font-family:ui-monospace,Menlo,Consolas,monospace}
.nd .halo{fill:none;stroke:var(--sig);stroke-width:3;opacity:0}
.nd.sel .halo{opacity:1}
.nd.prev .halo{opacity:.7;stroke-dasharray:4 4}
.nd.path .shp{stroke:var(--sig)!important;stroke-width:4}
.nd.off,.ed.off{display:none}
.far .nd .lbl{display:none}
.far .nd.sel .lbl,.far .nd.hov .lbl,.far .nd.path .lbl{display:block}
.ed .vis{stroke:var(--line);stroke-width:1.7;fill:none}
.ed.dash .vis{stroke-dasharray:7 5}
.ed.grp .vis{stroke-dasharray:2 5;stroke-width:2.2}
.ed.path .vis,.ed.esel .vis{stroke:var(--sig);stroke-width:3.4}
.ed.inc .vis{stroke:#5c6b7b;stroke-width:2.2}
.ed .hit{stroke:transparent;stroke-width:20}
.ed .elbl{font-size:var(--fs,14px);fill:#33424f;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round;pointer-events:none;text-anchor:middle}
.ed.path .elbl,.ed.esel .elbl{fill:var(--sig2);font-weight:700}
.far .ed .elbl,.mid .ed .elbl{display:none}
.mid .ed.inc .elbl,.mid .ed.path .elbl,.mid .ed.esel .elbl{display:block}
.far .ed.esel .elbl,.far .ed.path .elbl{display:block}
@media (max-width:720px){
  header{padding:6px 10px}
  header small{display:none}
  .srch{order:3;flex-basis:100%}
  main{flex-direction:column}
  #panel{width:auto;height:40%;border-left:0;border-top:2px solid var(--band2)}
  #mini{width:110px;height:76px}
  .hbtn{padding:0 9px}
}
</style>
</head>

function collide(x,y,extra,ign){for(const v of VN.values()){if(v.key===ign)continue;if(Math.hypot(v.tx-x,v.ty-y)<62)return true}for(const p of extra)if(Math.hypot(p.x-x,p.y-y)<62)return true;return false}
function slots(pk,count){const p=VN.get(pk);const gp=p.parent&&VN.get(p.parent);let dir,span;
  const others=[...VN.values()].filter(v=>v.key!==pk);
  if(gp){dir=Math.atan2(p.ty-gp.ty,p.tx-gp.tx);span=Math.min(Math.PI*1.25,Math.max(Math.PI/2.4,count*0.36))}
  else if(others.length){let cx=0,cy=0;others.forEach(v=>{cx+=v.tx;cy+=v.ty});cx/=others.length;cy/=others.length;dir=Math.atan2(p.ty-cy,p.tx-cx);span=Math.min(Math.PI*1.5,Math.max(Math.PI/2,count*0.4))}
  else{dir=-Math.PI/2;span=2*Math.PI}
  const full=span>=2*Math.PI-1e-3,R0=Math.max(200,count*44/span),out=[];
  for(let k=0;k<count;k++){const a=full?dir+2*Math.PI*k/count:(count===1?dir:dir-span/2+span*k/(count-1));let r=R0,x,y;
    for(let t=0;t<14;t++){x=p.tx+Math.cos(a)*r;y=p.ty+Math.sin(a)*r;if(!collide(x,y,out))break;r+=46}out.push({x,y})}
  return out}
function spawn(p,pos,pk){const t=now();return{x:p.x,y:p.y,fx:p.x,fy:p.y,tx:pos.x,ty:pos.y,t0:t,dur:motion?340:0,parent:pk}}

  for(const x of pairs){if(!filt.ek.has(E[x.e].k))continue;const k='n'+x.j;if(VN.has(k))addVE(x.e,true);else if(!fresh.some(f=>f.j===x.j))fresh.push(x)}
  let items=fresh,groups=[];
  if(opt.group||fresh.length>12){const b=new Map();for(const x of fresh){const key=(N[x.j].o||'-')+'|'+N[x.j].k;if(!b.has(key))b.set(key,[]);b.get(key).push(x)}
    items=[];for(const arr of b.values()){if(arr.length<=3)items.push(...arr);else groups.push(arr)}}
  const pos=slots(pk,items.length+groups.length);let q=0;
  for(const arr of groups){const gk='g'+(++gseq),n0=N[arr[0].j];VN.set(gk,{key:gk,n:-1,grp:{items:arr,next:0,ek:E[arr[0].e].k,org:n0.o,kind:n0.k,out:E[arr[0].e].s===p.n},...spawn(p,pos[q++],pk)});
    const out=E[arr[0].e].s===p.n;VE.set('ge'+gk,{key:'ge'+gk,a:out?pk:gk,b:out?gk:pk,e:null,grp:gk});if(motion)sigs.push({ve:'ge'+gk,t0:now()+200,dur:700});nk.push(gk)}
  for(const x of items){const k='n'+x.j;VN.set(k,{key:k,n:x.j,grp:null,...spawn(p,pos[q++],pk)});addVE(x.e,true);nk.push(k)}
  return nk}
function releaseGroup(gk){const g=VN.get(gk),G=g.grp,pk=g.parent,chunk=G.items.slice(G.next,G.next+12).filter(x=>!VN.has('n'+x.j));G.next+=12;
  const pos=slots(gk,chunk.length),nk=[];chunk.forEach((x,i)=>{const k='n'+x.j;VN.set(k,{key:k,n:x.j,grp:null,...spawn(g,pos[i],gk)});addVE(x.e,true,i*25);nk.push(k)});

    ()=>{const o=[];for(const [s] of stdK){const per={};const pr=nb(s,2).filter(x=>N[x.j].o!==org&&N[x.j].k===3).filter(x=>{const c=per[N[x.j].o]=(per[N[x.j].o]||0)+1;return c<=2});pr.forEach(x=>benK.set(x.j,1));o.push(...reveal('n'+s,pr))}return o},

    ()=>{const o=[];for(const [r] of ridK){o.push(...reveal('n'+r,nb(r,1).filter(x=>N[x.j].k===1)))}return o}]}

  if(!prev.has(b))return null;const path=[];let c=b;while(c!==a){const e=prev.get(c);path.unshift({e,j:c,from:other(e,c)});c=other(e,c)}return path}

  const hasKids=[...VN.values()].some(x=>x.parent===sel);
  const ang=[-90,-30,30,90,150,210,-150];let i=0;
  for(const L of list){const b=h('button',{class:'chip'+(L.done?' done':''),'data-a':ang[i++%ang.length]});b.innerHTML=esc(L.name)+'<b>'+L.c+'</b>';b.addEventListener('click',e=>{e.stopPropagation();expand(sel,L.ek)});b.style.animationDelay=(i*40)+'ms';chipsEl.appendChild(b)}
  if(hasKids){const b=h('button',{class:'chip fold','data-a':ang[i++%ang.length]});b.innerHTML='접기<b>−</b>';b.addEventListener('click',e=>{e.stopPropagation();collapse(sel)});chipsEl.appendChild(b)}}
function placeChips(){const v=sel&&VN.get(sel);if(!v||chipsEl.hidden){chipsEl.style.display='none';return}chipsEl.style.display='';const sx=v.x*view.s+view.tx,sy=v.y*view.s+view.ty,r=(nodeEls.get(sel)?.r||14)*view.s;const R=Math.max(68,r+46);
  for(const b of chipsEl.children){const a=+b.dataset.a*Math.PI/180;b.style.left=(sx+Math.cos(a)*(R+18))+'px';b.style.top=(sy+Math.sin(a)*R)+'px'}}

/* ---------- panel ---------- */
const panel=$('#panel');
function propTable(p,order){const t=h('table',{class:'pt'});const keys=order?order.filter(k=>k in p).concat(Object.keys(p).filter(k=>!order.includes(k))):Object.keys(p);
  for(const k of keys){const v=p[k];if(v==null||v==='')continue;const tr=h('tr');tr.appendChild(h('td',null,k));const td=h('td',{class:typeof v==='number'?'num':''});
    if(k==='출처URL'){td.textContent=v;td.style.fontSize='14px'}else td.textContent=typeof v==='boolean'?(v?'예':'아니오'):String(v);tr.appendChild(td);t.appendChild(tr)}return t}
function sec(title,...kids){const s=h('div',{class:'sec'});s.appendChild(h('h3',null,title));kids.forEach(k=>k&&s.appendChild(k));return s}
function pbtn(txt,fn,cls=''){const b=h('button',{class:'pbtn '+cls},txt);b.addEventListener('click',fn);if(busy)b.disabled=true;return b}
function nodeName(k){const v=VN.get(k);return v?vnInfo(v).label:''}
function buildPanel(){panel.textContent='';
  if(selEdge&&VE.has(selEdge)){const ve=VE.get(selEdge);const hd=h('div',{class:'ph'});hd.appendChild(h('div',{class:'t'},ve.e!=null?EK[E[ve.e].k]+' 엣지':'묶음 엣지'));hd.appendChild(h('div',{class:'s'},'엣지를 골랐습니다'));panel.appendChild(hd);
    const base={출발:nodeName(ve.a),도착:nodeName(ve.b)};if(ve.e!=null){base.관계이름=EK[E[ve.e].k];Object.assign(base,E[ve.e].p);base.선=E[ve.e].k===4?'점선 (두 판독 제안, 담당자 확정 전)':'실선 (확정된 관계)'}
    panel.appendChild(sec('엣지 속성',propTable(base)));
    panel.appendChild(sec('양 끝 노드',pbtn('출발 노드 보기: '+trunc(base.출발,18),()=>{selectNode(ve.a);centerOn(VN.get(ve.a).tx,VN.get(ve.a).ty)}),pbtn('도착 노드 보기: '+trunc(base.도착,18),()=>{selectNode(ve.b);centerOn(VN.get(ve.b).tx,VN.get(ve.b).ty)})));return}
  const v=sel&&VN.get(sel);
  if(!v){panel.appendChild(h('div',{class:'ph'},'')).appendChild(h('div',{class:'t'},'고른 노드 없음'));panel.appendChild(sec('쓰는 법',h('div',{class:'muted'},'노드를 누르면 둘레에 관계 칩이 뜹니다. 칩을 누르면 그 관계의 이웃이 펼쳐집니다. 펼친 노드에서 또 펼쳐 홉을 넘어가며 넓혀 갑니다. 바탕을 끌어 옮기고, 두 손가락이나 휠로 확대합니다.')));return}
  if(v.n<0){const G=v.grp;const hd=h('div',{class:'ph'});hd.appendChild(h('div',{class:'t'},vnInfo(v).label));panel.appendChild(hd);panel.appendChild(sec('묶음',h('div',{class:'muted'},'누를 때마다 12개씩 풉니다. 전체 '+G.items.length+'개, 푼 것 '+Math.min(G.next,G.items.length)+'개.'),pbtn('다음 12개 풀기',()=>tapGroup(v.key),'dark')));return}
  const n=N[v.n];const hd=h('div',{class:'ph'});hd.appendChild(h('div',{class:'t'},n.l));hd.appendChild(h('div',{class:'s'},KIND[n.k]+(n.o?' · '+(ORGNAME[n.o]||n.o):'')));panel.appendChild(hd);
  const order={3:['기준지급액','기준가입금액만원','면책일수','감액','지급횟수제한','근거']}[n.k];panel.appendChild(sec('속성',propTable(n.p,order)));
  const hops=[];
  if(n.k===3||n.k===2)hops.push(pbtn('같은 담보를 가진 다른 회사의 특약 (4홉)',()=>hopSameStd(sel),'dark'));
  if(n.k===4){hops.push(pbtn('이 담보를 가진 회사별 급부',()=>hopStdByOrg(sel),'dark'));hops.push(pbtn('상위와 통합 담보 (2홉) + 보장 분야',()=>hopStdRel(sel),'dark'))}
  if(n.k===0)hops.push(pbtn('최근 소식',()=>hopNews(sel),'dark'));
  if(n.k===1)hops.push(pbtn('같은 회사의 다른 종형 (2홉)',()=>hopSiblings(sel),'dark'));
  if(prevSel&&VN.has(prevSel)&&prevSel!==sel)hops.push(pbtn('길 찾기: '+trunc(nodeName(prevSel),12)+' → '+trunc(n.l,12),findPath));
  else hops.push(h('div',{class:'muted'},'길 찾기: 노드 하나를 고른 뒤 다른 노드를 고르면 단추가 뜹니다.'));
  if(pathE.size)hops.push(pbtn('길 표시 지우기',()=>{pathE.clear();pathN.clear();refresh()}));
  hops.push(pbtn('가지 접기',()=>collapse(sel)));
  panel.appendChild(sec('여러 홉 탐색',...hops));
  const box=h('div');EK.forEach((name,ek)=>{const pr=nb(v.n,ek);if(!pr.length)return;const shown=pr.filter(x=>VE.has('e'+x.e));
    const r=h('button',{class:'el'});r.innerHTML='<span class="kb">'+esc(name)+'</span><span class="num">'+pr.length+'</span><span class="muted">'+(shown.length?'펼침 '+shown.length:'누르면 펼침')+'</span>';r.addEventListener('click',()=>expand(sel,ek));box.appendChild(r);
    shown.slice(0,8).forEach(x=>{const b=h('button',{class:'el'});b.style.paddingLeft='18px';b.innerHTML='<span class="muted">└</span><span>'+esc(eLabel(x.e))+' · '+esc(trunc(N[x.j].l,22))+'</span>';b.addEventListener('click',()=>{selEdge='e'+x.e;refresh()});box.appendChild(b)})});
  panel.appendChild(sec('달린 엣지',box))}
function buildTrail(){const t=$('#trail');t.textContent='';t.appendChild(h('span',{class:'tl'},'자취'));if(!trail.length){t.appendChild(h('span',{class:'muted'},'아직 고른 노드가 없습니다'));return}
  trail.forEach((k,i)=>{if(i)t.appendChild(h('span',{class:'sep'},'›'));const b=h('button',{class:k===sel?'cur':''},trunc(nodeName(k),14));b.addEventListener('click',()=>{const v=VN.get(k);if(!v)return;sel=k;selEdge=null;ring(k);refresh();centerOn(v.tx,v.ty)});t.appendChild(b)});t.scrollLeft=t.scrollWidth}
function refresh(){buildChips();buildPanel();buildTrail();startCard();kick()}
function rebuildAll(){nodeEls.forEach(o=>o.g.remove());nodeEls.clear();edgeEls.forEach(o=>o.g.remove());edgeEls.clear();refresh()}

/* ---------- filters / minimap / start ---------- */
function buildFilters(){const f=$('#filt');f.textContent='';const tog=h('button',{class:'fc',id:'ftog'},f.dataset.open==='0'?'거르기 ▸':'거르기 ▾');tog.addEventListener('click',()=>{f.dataset.open=f.dataset.open==='0'?'1':'0';buildFilters()});f.appendChild(tog);if(f.dataset.open==='0')return;
  EK.forEach((name,ek)=>{const b=h('button',{class:'fc'+(filt.ek.has(ek)?'':' off')},name);b.addEventListener('click',()=>{filt.ek.has(ek)?filt.ek.delete(ek):filt.ek.add(ek);buildFilters();refresh()});f.appendChild(b)});
  [...MAIN,'OTHER'].forEach(o=>{const b=h('button',{class:'fc'+(filt.org.has(o)?'':' off')});b.innerHTML='<i style="background:'+(o==='OTHER'?'#6c5fa7':ORGC[o])+'"></i>'+(o==='OTHER'?'그 밖의 회사':ORGNAME[o]);b.addEventListener('click',()=>{filt.org.has(o)?filt.org.delete(o):filt.org.add(o);buildFilters();refresh()});f.appendChild(b)})}
const mini=$('#mini');
function drawMini(){if(!VN.size){mini.style.display='none';return}mini.style.display='';const W=mini.clientWidth,H=mini.clientHeight;const b=bbox([...VN.keys()]);const vx0=-view.tx/view.s,vy0=-view.ty/view.s,vx1=vx0+cw()/view.s,vy1=vy0+ch()/view.s;
  const x0=Math.min(b.x0,vx0)-40,y0=Math.min(b.y0,vy0)-40,x1=Math.max(b.x1,vx1)+40,y1=Math.max(b.y1,vy1)+40;const s=Math.min(W/(x1-x0),H/(y1-y0));mini._m={x0,y0,s};
  let out='';for(const v of VN.values()){const c=v.key===sel?'#0aa5a5':vnInfo(v).col;out+='<circle cx="'+((v.x-x0)*s).toFixed(1)+'" cy="'+((v.y-y0)*s).toFixed(1)+'" r="'+(v.key===sel?3.5:2.2)+'" fill="'+c+'"/>'}
  out+='<rect x="'+((vx0-x0)*s).toFixed(1)+'" y="'+((vy0-y0)*s).toFixed(1)+'" width="'+((vx1-vx0)*s).toFixed(1)+'" height="'+((vy1-vy0)*s).toFixed(1)+'" fill="rgba(10,165,165,.08)" stroke="#0aa5a5" stroke-width="1.5"/>';mini.innerHTML=out}
mini.addEventListener('pointerdown',e=>{const m=mini._m;if(!m)return;const r=mini.getBoundingClientRect();centerOn((e.clientX-r.left)/m.s+m.x0,(e.clientY-r.top)/m.s+m.y0);e.stopPropagation()});
const STARTS=['일반암 진단비','유사암 진단비(통합)','뇌졸중 진단비','급성심근경색증 진단비','암 수술비'];
function startCard(){let c=$('.st');if(VN.size){if(c)c.remove();return}if(c)return;c=h('div',{class:'st'});c.appendChild(h('h2',null,'어디서부터 넘어가 볼까요'));c.appendChild(h('p',null,'시작점을 고르면 그 노드 하나가 가운데 놓입니다. 노드를 눌러 관계 칩을 펼치면서 홉을 넘어갑니다. 위 찾기 줄에 이름을 쳐도 됩니다.'));
  c.appendChild(h('div',{class:'lab'},'회사'));let r=h('div',{class:'row'});MAIN.forEach(o=>{const i=N.findIndex(n=>n.k===0&&n.o===o);const b=h('button');b.innerHTML='<span class="kb" style="color:'+ORGC[o]+'">'+orgBadge(o)+'</span>'+esc(ORGNAME[o]);b.addEventListener('click',()=>startAt(i));r.appendChild(b)});c.appendChild(r);
  c.appendChild(h('div',{class:'lab'},'표준담보'));r=h('div',{class:'row'});STARTS.forEach(nm=>{const i=N.findIndex(n=>n.k===4&&n.l===nm);if(i<0)return;const b=h('button',null,nm);b.addEventListener('click',()=>startAt(i));r.appendChild(b)});c.appendChild(r);cv.appendChild(c)}

/* ---------- search ---------- */
const q=$('#q'),sugg=$('#sugg');const PRI={4:0,2:1,1:2,0:3};
q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();sugg.textContent='';if(!s){sugg.style.display='none';return}
  const hits=N.filter(n=>n.k in PRI&&n.l.toLowerCase().includes(s)).sort((a,b)=>PRI[a.k]-PRI[b.k]||a.l.length-b.l.length).slice(0,14);
  if(!hits.length){sugg.appendChild(h('div',{class:'el muted'},'맞는 이름이 없습니다'))}
  hits.forEach(n=>{const b=h('button');b.innerHTML='<span class="kb" style="color:'+orgColor(n.o)+'">'+KIND[n.k]+'</span><span>'+esc(trunc(n.l,34))+'</span>'+(n.o&&n.k!==0?'<span class="muted">'+esc(ORGNAME[n.o]||'')+'</span>':'');b.addEventListener('click',()=>startAt(n.i));sugg.appendChild(b)});sugg.style.display='block'});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=sugg.querySelector('button');if(b)b.click()}if(e.key==='Escape')sugg.style.display='none'});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.srch'))sugg.style.display='none'});

/* ---------- pointer ---------- */
const ptrs=new Map();let gest=null;
function local(e){const r=svg.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);const p=local(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===1){const t=e.target.closest('[data-vn],[data-ve]');gest={type:'one',p0:p,moved:false,vn:t&&t.dataset.vn,ve:t&&t.dataset.ve,v0:{...view}};if(gest.vn){const v=VN.get(gest.vn);gest.n0={x:v.tx,y:v.ty}}}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];gest={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},v0:{...view}}}viewAnim=null});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=local(e);ptrs.set(e.pointerId,p);if(!gest)return;
  if(gest.type==='pinch'&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};const s2=Math.max(.25,Math.min(3,gest.v0.s*d/gest.d0));const wx=(gest.m0.x-gest.v0.tx)/gest.v0.s,wy=(gest.m0.y-gest.v0.ty)/gest.v0.s;view={s:s2,tx:m.x-wx*s2,ty:m.y-wy*s2};kick();return}
  if(gest.type!=='one')return;const dx=p.x-gest.p0.x,dy=p.y-gest.p0.y;if(!gest.moved&&Math.hypot(dx,dy)>7)gest.moved=true;if(!gest.moved)return;
  if(gest.vn){const v=VN.get(gest.vn);if(v){v.tx=v.x=gest.n0.x+dx/view.s;v.ty=v.y=gest.n0.y+dy/view.s;v.dur=0;kick()}}else{view.tx=gest.v0.tx+dx;view.ty=gest.v0.ty+dy;kick()}});
function up(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);const g=gest;if(g&&g.type==='one'&&!g.moved){if(g.vn&&VN.has(g.vn)){if(VN.get(g.vn).n<0)tapGroup(g.vn);else selectNode(g.vn)}else if(g.ve&&VE.has(g.ve)){selEdge=g.ve;refresh()}else{if(selEdge){selEdge=null;refresh()}}}
  if(ptrs.size===0)gest=null;else if(g&&g.type==='pinch')gest={type:'none'}}
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();const p=local(e);zoomAt(p.x,p.y,Math.exp(-e.deltaY*.0015))},{passive:false});
$('#zIn').onclick=()=>zoomAt(cw()/2,ch()/2,1.25);$('#zOut').onclick=()=>zoomAt(cw()/2,ch()/2,.8);$('#zFit').onclick=()=>fitView();
$('#bUndo').onclick=undo;$('#bHome').onclick=()=>{if(busy)return;snapshot();VN=new Map();VE=new Map();trail=[];sel=prevSel=selEdge=null;pathE.clear();pathN.clear();rebuildAll()};
$('#bMotion').onclick=()=>{motion=!motion;$('#bMotion').classList.toggle('on',motion);$('#bMotion').textContent=motion?'움직임 켬':'움직임 끔';$('#app').classList.toggle('motion',motion)};
addEventListener('resize',kick);
$('#filt').dataset.open=innerWidth<720?'0':'1';buildFilters();refresh();
window.__g={N,E,get VN(){return VN},get VE(){return VE},get sel(){return sel},nodeKey:nm=>'n'+N.findIndex(n=>n.l===nm),startAt,expand:(k,ek)=>expand(k,ek),fitView};
</script>

<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판단 지원 콘솔 시안</title>
<meta name="description" content="우체국보험 판단 지원 앱의 UI/UX 개편 시안: 브리핑, 장비 비교식 담보 비교, 초점 관계 그림과 근거 서랍">
<link rel="icon" href="data:,">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --cut:12px;
  --f-sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular","D2Coding",Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --stick:120px;
  color-scheme:dark;
  --bg:#060a12; --bg-glow:rgba(40,120,160,.16);
  --hud:#070c15;
  --panel:#0c1422; --panel-2:#111b2d; --panel-3:#16233a;
  --line:#1f2d45; --line-2:#2e4468; --track:#18253b;
  --text:#e8eef7; --text-2:#b3c0d3; --text-3:#8e9db4;
  --accent:#2fd6d0; --accent-soft:rgba(47,214,208,.13); --glow:rgba(47,214,208,.38);
  --c-EPOST:#2fd6d0; --c-HANWHALIFE:#f4a62a; --c-SAMSUNGFIRE:#b39dff;
  --good:#4ade80; --bad:#fb7185; --mixed:#f9a8d4; --hold:#a9b6c9; --gap:#8e9db4;
  --dot:rgba(140,175,215,.11); --scan:rgba(47,214,208,.09); --scrim:rgba(2,6,12,.6);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#edf1f6; --bg-glow:rgba(10,123,131,.08);
  --hud:#edf1f6;
  --panel:#ffffff; --panel-2:#f5f7fa; --panel-3:#eaf1f7;
  --line:#d5dde8; --line-2:#aebdd0; --track:#e3e9f1;
  --text:#0e1828; --text-2:#34455c; --text-3:#4f5f75;
  --accent:#0a7880; --accent-soft:rgba(10,120,128,.09); --glow:rgba(10,120,128,.22);
  --c-EPOST:#0a7880; --c-HANWHALIFE:#a35800; --c-SAMSUNGFIRE:#6a4bd6;
  --good:#13773a; --bad:#bd1740; --mixed:#9d2389; --hold:#55657b; --gap:#5d6d83;
  --dot:rgba(30,50,90,.09); --scan:rgba(10,120,128,.07); --scrim:rgba(20,30,45,.35);
}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--f-sans);font-variant-numeric:tabular-nums;min-height:100vh;overflow-x:hidden;word-break:keep-all;overflow-wrap:anywhere}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(1100px 560px at 72% -12%,var(--bg-glow),transparent 70%),
             radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.6px) 0 0/24px 24px,var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--panel);padding:8px 12px;border:1px solid var(--accent)}
.skip:focus{top:8px}
kbd{font:12px/1 var(--f-mono);color:var(--text-3);border:1px solid var(--line-2);padding:3px 5px}
code,.mono{font-family:var(--f-mono);font-size:13px}
.dim{color:var(--text-3)}

/* 머리줄 */
.top{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:18px;padding:0 24px;background:var(--hud);border-bottom:1px solid var(--line);view-transition-name:hud-top}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-size:16px;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--text-3);line-height:1.2;white-space:nowrap}
.badge{font:12px/1 var(--f-mono);color:var(--accent);border:1px solid var(--accent);padding:3px 6px;margin-left:4px}
.views{display:flex;gap:4px;margin-left:auto}
.tab{position:relative;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid transparent;background:none;color:var(--text-2);font-size:15px;cursor:pointer;transition:color .2s,background-color .2s}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--line-2);background:var(--panel-2)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--accent);box-shadow:0 0 12px var(--glow)}
.tab .ti{font:12px/1 var(--f-mono);color:var(--text-3)}
.theme{height:34px;padding:0 12px;border:1px solid var(--line-2);background:var(--panel);color:var(--text-2);font-size:14px;cursor:pointer;white-space:nowrap}
.theme:hover{color:var(--text)}

/* 조건 줄 */
.cond{position:sticky;top:56px;z-index:29;background:var(--hud);border-bottom:1px solid var(--line);view-transition-name:hud-cond}
.cond-in{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.cf{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cl{font:12px/1 var(--f-mono);letter-spacing:.06em;color:var(--text-3);margin-right:4px}
.chip{height:32px;padding:0 12px;border:1px solid var(--line-2);background:var(--panel);color:var(--text-2);font-size:14px;cursor:pointer;transition:background-color .2s,border-color .2s,color .2s}
.chip:hover{color:var(--text)}
.chip[aria-checked="true"],.chip.on{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
.stepper{display:flex;align-items:center;height:32px;border:1px solid var(--line-2);background:var(--panel)}
.stepper button{width:32px;height:100%;border:0;background:none;color:var(--text-2);font-size:18px;cursor:pointer}
.stepper button:hover{color:var(--accent)}
.stepper input{width:40px;height:100%;border:0;background:none;color:var(--text);font:700 16px/1 var(--f-sans);text-align:right;padding:0 2px}
.stepper .u{color:var(--text-3);font-size:14px;padding:0 4px 0 2px}
.quick{display:flex;gap:4px}
.quick .chip{padding:0 9px}
.status{margin-left:auto;gap:12px}
.st-o{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);white-space:nowrap}
.st-o .ok{color:var(--good)} .st-o .no{color:var(--bad)}

main{max-width:1240px;margin:0 auto;padding:22px 24px 72px}
.view[hidden]{display:none}

/* 패널: 모서리를 깎은 면과 1px 테두리 선 */
.panel{position:relative;background:var(--panel);padding:20px 22px;
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.frame{position:absolute;inset:0;pointer-events:none;z-index:2}
.frame i{position:absolute;display:block;background:var(--line-2)}
.frame .t{top:0;left:var(--cut);right:0;height:1px;transform-origin:left}
.frame .r{top:0;right:0;bottom:var(--cut);width:1px;transform-origin:top}
.frame .b{bottom:0;left:0;right:var(--cut);height:1px;transform-origin:right}
.frame .l{top:var(--cut);left:0;bottom:0;width:1px;transform-origin:bottom}
.frame .d1{top:0;left:0;width:calc(var(--cut)*1.4142 + 1px);height:1px;transform-origin:0 0;transform:translateY(var(--cut)) rotate(-45deg)}
.frame .d2{bottom:0;right:0;width:calc(var(--cut)*1.4142 + 1px);height:1px;transform-origin:100% 100%;transform:translateY(calc(-1*var(--cut))) rotate(-45deg)}
.panel.hi .frame .t{background:linear-gradient(90deg,var(--accent),var(--line-2) 35%)}
.panel.hi .frame .d1{background:var(--accent)}

.pre .panel{visibility:hidden}
.enter .frame .t,.enter .frame .b{animation:drawX 380ms var(--ease) both}
.enter .frame .r,.enter .frame .l{animation:drawY 380ms var(--ease) both}
.enter .frame .d1,.enter .frame .d2{animation:fade 200ms linear both}
.enter .frame .t{animation-delay:calc(var(--pi,0)*50ms)}
.enter .frame .r{animation-delay:calc(var(--pi,0)*50ms + 100ms)}
.enter .frame .b{animation-delay:calc(var(--pi,0)*50ms + 180ms)}
.enter .frame .l{animation-delay:calc(var(--pi,0)*50ms + 250ms)}
.enter .frame .d1,.enter .frame .d2{animation-delay:calc(var(--pi,0)*50ms + 300ms)}
.enter .panel>:not(.frame){animation:rise 420ms var(--ease) both;animation-delay:calc(var(--pi,0)*50ms + 140ms)}
.enter .gpanel>.graph{animation:none}
@keyframes drawX{from{transform:scaleX(0)}}
@keyframes drawY{from{transform:scaleY(0)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

.kick{display:flex;align-items:center;gap:8px;font:12px/1.2 var(--f-mono);letter-spacing:.08em;color:var(--accent)}
.kick::before{content:"";width:14px;height:1px;background:currentColor}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.vhead{margin:2px 0 16px}
.vhead h2{font-size:24px;line-height:1.3;margin-top:6px}
.sub{margin:6px 0 0;color:var(--text-2)}
.fine{margin:14px 2px 0;font-size:13px;color:var(--text-3);line-height:1.6}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:1px solid var(--line-2);font-size:13px;color:var(--text-2);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.accent{border-color:var(--accent);background:var(--accent-soft)}
.btn.accent:hover{box-shadow:0 0 0 1px var(--accent),0 0 18px var(--glow)}

/* 판정 표시: 색과 기호를 함께 */
.vchip{display:inline-flex;align-items:center;gap:5px;font-size:13px;line-height:1.3;color:var(--text-2);white-space:nowrap}
.vchip b{font-weight:700}
.good{--vc:var(--good)} .bad{--vc:var(--bad)} .mixed{--vc:var(--mixed)} .hold{--vc:var(--hold)} .gap{--vc:var(--gap)} .gapc{--vc:var(--text-2)} .same{--vc:var(--text-3)} .base{--vc:var(--accent)}
.vchip b,.delta b,.rs b{color:var(--vc)}
.vchip.good,.vchip.bad,.vchip.mixed,.vchip.base{color:var(--text)}
.gl{flex:none;display:block}

/* 브리핑 */
.brief{display:grid;gap:16px}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:center;padding:24px 26px}
.hero h1{font-size:28px;line-height:1.3;margin-top:8px}
.lead{margin:10px 0 0;font-size:16px;line-height:1.65;color:var(--text)}
.asof{margin:10px 0 0;font-size:13px;color:var(--text-3)}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gauge{padding:12px 12px 10px;background:var(--panel-2);border:1px solid var(--line)}
.gauge .cap{display:block;font-size:13px;color:var(--text-2);line-height:1.35;min-height:2.7em}
.gauge .n{display:flex;align-items:baseline;gap:3px;margin-top:4px}
.num{display:inline-block;font-size:32px;font-weight:700;line-height:1.1;text-align:right}
.gauge .u{font-size:14px;color:var(--text-3)}
.ticks20{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin-top:8px;height:6px}
.ticks20 i{background:var(--track)}
.ticks20 i.f{background:var(--gc,var(--accent))}
.gauge.bad{--gc:var(--bad)} .gauge.good{--gc:var(--good)}
.enter .ticks20 i.f{animation:fade 240ms linear both;animation-delay:calc(var(--pi,0)*50ms + 240ms + var(--ti)*10ms)}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:10px;padding:20px 20px 18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ctag{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700}
.ctag i{width:10px;height:10px;display:block;background:var(--vc)}
.card.k-gap .ctag i{background:none;border:1.5px dashed var(--gap)}
.cno{font:12px/1 var(--f-mono);color:var(--text-3)}
.card .big{display:flex;align-items:baseline;gap:4px}
.card .big .u{color:var(--text-3)}
.card p{margin:0;color:var(--text-2);line-height:1.6}
.items{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:6px}
.it{display:block;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);cursor:pointer;line-height:1.45;transition:border-color .2s}
.it:hover{border-color:var(--accent)}
.it .in{display:block;font-weight:600}
.it .is{display:block;font-size:13px;color:var(--text-2);margin-top:2px}
.card-f{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:auto;padding-top:4px;font-size:13px;color:var(--text-3)}
.lnk{border:0;background:none;padding:0;color:var(--accent);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.row2{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:start}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.sec-h h2{font-size:19px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.land-grid{display:grid;grid-template-columns:76px repeat(5,minmax(0,1fr));gap:6px}
.lh{font-size:13px;color:var(--text-3);text-align:center;align-self:end}
.lr{font-size:14px;color:var(--text-2);align-self:center;line-height:1.3}
.lc{display:flex;flex-direction:column;align-items:stretch;gap:4px;height:104px;padding:7px 6px 6px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;min-width:0;transition:border-color .2s}
.lc:hover{border-color:var(--accent)}
.lc.empty{cursor:default;background:none;border-style:dashed;justify-content:center;align-items:center;color:var(--text-3);font-size:13px}
.lc-n{font:12px/1 var(--f-mono);color:var(--text-3);text-align:left}
.bars{flex:1;display:flex;align-items:stretch;justify-content:center;gap:6px}
.bar{position:relative;width:14px;background:var(--track)}
.bar i{position:absolute;inset:0;transform-origin:bottom;transform:scaleY(var(--v));background:var(--c)}
.bar.o1 i{background:repeating-linear-gradient(135deg,var(--c) 0 3px,color-mix(in srgb,var(--c) 65%,transparent) 3px 5px)}
.enter .bar i{animation:growY 340ms var(--ease) both;animation-delay:calc(var(--pi,0)*50ms + 160ms + var(--d)*7ms)}
@keyframes growY{from{transform:scaleY(0)}}
.cnt{display:flex;justify-content:center;gap:6px;font:12px/1 var(--f-mono);color:var(--text-2)}
.cnt span{width:14px;text-align:center}

.lineup{display:grid;gap:10px}
.lu{padding:12px 14px;border:1px solid var(--line);background:var(--panel-2);border-left:2px solid var(--c)}
.lu-h{display:flex;align-items:center;gap:8px;font-weight:700}
.lu-p{font-size:14px;color:var(--text-2);margin-top:4px;line-height:1.45}
.lu-m{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--text-3);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--text)}
.pill b{color:var(--vc)}

/* 담보 비교 */
.cmp{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
.inv{padding:0}
.inv-sc{padding:16px 12px 14px 16px}
.inv-f{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.inv-f .chip{height:30px;padding:0 10px}
.grp{font:12px/1 var(--f-mono);letter-spacing:.06em;color:var(--text-3);margin:14px 0 6px 4px}
.row{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid transparent;background:none;color:var(--text);text-align:left;cursor:pointer;position:relative;line-height:1.4}
.row:hover{background:var(--panel-2)}
.row.on{background:var(--accent-soft);border-color:var(--accent)}
.row.on::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--accent);box-shadow:0 0 10px var(--glow)}
.gls{display:flex;gap:3px}
.rs{font-size:15px;font-weight:700}
.inv-lg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--text-2)}
.inv-lg span{display:inline-flex;gap:5px;align-items:center}
.det{padding:20px 22px 22px;scroll-margin-top:calc(var(--stick) + 12px)}
.det-h{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.det-name{font-size:24px;line-height:1.3;margin-top:6px;display:inline-block}
.eq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px;margin-top:16px}
.eq-col{position:relative;display:grid;grid-row:span 9;grid-template-rows:subgrid;border:1px solid var(--line);background:var(--panel-2);min-width:0}
.eq-col::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;background:var(--c)}
.eq-col.o0{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.eq-col>*{padding:10px 14px;border-top:1px solid var(--line);min-width:0}
.eq-col>:first-child{border-top:0}
.eq.enter .eq-col{animation:rise 300ms var(--ease) both;animation-delay:calc(var(--oi)*50ms)}
.eq.enter .seg i{animation:growY 320ms var(--ease) both;animation-delay:calc(var(--oi)*50ms + 120ms)}
.eq-h{display:grid;gap:4px;align-content:start}
.eq-org{display:flex;align-items:center;gap:7px;font-size:16px}
.eq-var{font-size:13px;color:var(--text-2);line-height:1.4}
.cap{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3);letter-spacing:.02em;margin-bottom:2px}
.st{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.st .v{font-size:16px;font-weight:600}
.st .big{font-size:20px;font-weight:700;line-height:1.3}
.st .sm{font-size:13px;color:var(--text-2);line-height:1.45}
.st .t{font-size:14px;color:var(--text);line-height:1.5}
.st .rider{font-size:13px;color:var(--text-2);line-height:1.45}
.st .bname{font-size:15px;font-weight:600;line-height:1.45}
.st.diff{box-shadow:inset 3px 0 0 var(--vc)}
.v.dimv{color:var(--text-3);font-weight:400;font-size:14px}
.delta{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--text);margin-top:2px}
.ptag{font-size:12px;color:var(--hold);border:1px dashed var(--hold);padding:0 5px;line-height:18px}
.eq-gap{grid-row:span 8;display:flex;flex-direction:column;gap:6px;justify-content:center;align-items:center;text-align:center;
  background:repeating-linear-gradient(135deg,transparent 0 7px,var(--track) 7px 8px);color:var(--text-2);padding:24px 16px}
.eq-gap b{font-size:16px;color:var(--text)}
.curve{position:relative;height:44px;width:100%;margin-top:4px;border-bottom:1px solid var(--line-2)}
.seg{position:absolute;top:0;bottom:0}
.seg i{position:absolute;inset:0 1px 0 0;transform-origin:bottom;transform:scaleY(var(--v));background:var(--c);opacity:.62}
.seg.zero{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line-2) 4px 5px)}
.seg em{position:absolute;left:4px;top:2px;font:12px/1 var(--f-mono);font-style:normal;color:var(--text)}
.tks{position:relative;width:100%;height:18px;font:12px/18px var(--f-mono);color:var(--text-3)}
.tks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.tks span:last-child{transform:translateX(-100%)}
.docbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--line-2);background:var(--panel);color:var(--text);font:13px var(--f-mono);cursor:pointer}
.docbtn:hover{border-color:var(--accent)}

  timers.push(setTimeout(() => v.classList.remove('enter'), 1000));
}
function stickH() { return $('#cond').getBoundingClientRect().bottom; }
function snapshot(roots) {
  const t = new Map(), m = new Map();
  roots.forEach(r => {
    $$('[data-k]', r).forEach(e => t.set(e.dataset.k, e.textContent));
    $$('[data-m]', r).forEach(e => m.set(e.dataset.m, e.style.getPropertyValue('--v')));
  });
  return { t, m };
}
function applyChanges(roots, before) {
  const els = roots.flatMap(r => $$('[data-k]', r));
  const changed = els.filter(e => before.t.has(e.dataset.k) && before.t.get(e.dataset.k) !== e.textContent);
  const top = stickH(), vh = innerHeight, DUR = 560;
  if (!reduce()) {
    roots.flatMap(r => $$('[data-m]', r)).forEach(e => {
      const o = before.m.get(e.dataset.m), n = e.style.getPropertyValue('--v');
      if (o != null && o !== n) running.push(e.animate([{ transform: `scaleY(${o})` }, { transform: `scaleY(${n})` }], { duration: 280, easing: EASE }));
    });
    const scan = $('#scan');
    running.push(scan.animate([
      { transform: `translateY(${top - 150}px)`, opacity: 0 },
      { opacity: 1, offset: 0.12 }, { opacity: 1, offset: 0.85 },
      { transform: `translateY(${vh - 126}px)`, opacity: 0 }], { duration: DUR, easing: 'cubic-bezier(.4,.1,.3,1)' }));
  }
  changed.forEach(e => {
    const now = e.textContent, r = e.getBoundingClientRect();
    const show = () => {
      e.textContent = now;
      if (!reduce()) running.push(e.animate([{ opacity: 0.15 }, { opacity: 1, offset: 0.3 }, { opacity: 0.35, offset: 0.55 }, { opacity: 1 }], { duration: 420, easing: 'linear' }));
      e.classList.add('chgm');
      setTimeout(() => e.classList.remove('chgm'), 1800);
    };
    if (reduce() || r.bottom < top || r.top > vh) { show(); return; }
    e.textContent = before.t.get(e.dataset.k);
    const delay = Math.max(0, Math.min(1, (r.top - top) / Math.max(1, vh - top))) * DUR * 0.9;
    let done = false;
    const f = () => { if (!done) { done = true; show(); } };
    pendingSwaps.push(f);
    timers.push(setTimeout(f, delay));
  });
  return changed.length;
}
let toastT = 0;
function toast(html) {
  const t = $('#toast');
  t.innerHTML = html; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ---------- 화면 전환 ---------- */
function render(view) {
  if (view === 'brief') renderBrief();
  else if (view === 'cmp') renderCmp();
  else renderFocus();
}
function show(view) {
  ['brief', 'cmp', 'focus'].forEach(n => {
    $('#v-' + n).hidden = n !== view;
    const t = $('#t-' + n);
    t.setAttribute('aria-selected', n === view);
    t.tabIndex = n === view ? 0 : -1;
  });
}
function go(view, src = null) {
  finishAll();
  if (drawerOpen()) closeDrawer();
  const update = () => {
    S.view = view;
    if (dirty[view] || view === 'focus') render(view);
    show(view);
    scrollTo(0, 0);
  };
  const after = () => { viewIn(view); if (view === 'focus') focusIn(src); };
  if (document.startViewTransition && !reduce()) {
    const t = vt = document.startViewTransition(update);
    t.ready.catch(() => {});
    t.updateCallbackDone.then(after, after);
    t.finished.finally(() => { if (vt === t) vt = null; });

}
function enterFocus(sid, srcEl, soft) {
  if (!sid) return;
  S.focus = sid;
  if (D.compare.includes(sid) && S.sel !== sid) { S.sel = sid; dirty.cmp = true; }
  if (S.view === 'focus' || soft) {
    finishAll();
    if (drawerOpen()) closeDrawer();
    S.view = 'focus'; render('focus'); show('focus');
    focusIn(null);
    return;
  }
  go('focus', srcEl ? srcEl.getBoundingClientRect() : null);
}

/* ---------- 조건 변경 ---------- */
function setCond(patch) {
  const old = { age: S.age, sex: S.sex, grade: S.grade };
  Object.assign(S, patch);
  S.age = Math.max(0, Math.min(120, Math.round(+S.age || 0)));
  if (old.age === S.age && old.sex === S.sex && old.grade === S.grade) { syncCond(); return; }
  finishAll();
  const view = $('#v-' + S.view), roots = [$('#cond'), view];
  const before = snapshot(roots);
  syncCond();
  dirty.brief = dirty.cmp = dirty.focus = true;
  render(S.view);
  if (S.view === 'focus') drawEdges();
  const n = applyChanges(roots, before);
  const what = [old.age !== S.age && `${old.age}세 → ${S.age}세`, old.sex !== S.sex && `${sexName(old.sex)} → ${sexName(S.sex)}`, old.grade !== S.grade && `간편 ${old.grade} → ${S.grade}`].filter(Boolean).join(', ');
  toast(`조건 변경: ${esc(what)}. ${n ? `이 화면에서 달라진 값 <b>${n}개</b>` : '이 화면에서 달라진 값은 없습니다'}`);
}

/* ---------- 입력 ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  if (a === 'view') go(el.dataset.view);
  else if (a === 'age') setCond({ age: S.age + +el.dataset.d });
  else if (a === 'agev') setCond({ age: +el.dataset.v });
  else if (a === 'sex') setCond({ sex: el.dataset.v });
  else if (a === 'grade') setCond({ grade: el.dataset.v });
  else if (a === 'sel') select(el.dataset.sid, { scroll: true });
  else if (a === 'filter') {
    S.filter = el.dataset.v;
    const p = P();
    $('#inv').innerHTML = invList(p);
    $$('.inv-f .chip').forEach(c => { const on = c.dataset.v === S.filter; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); });
    if (S.filter && D.std[S.sel].group !== S.filter) select(D.compare.find(s => D.std[s].group === S.filter));
  }
  else if (a === 'focus') {
    const src = el.dataset.src ? $(el.dataset.src) : (el.querySelector('.in, .rn') || el);
    if (drawerOpen()) closeDrawer();
    enterFocus(el.dataset.sid, src, !!el.dataset.soft);
  }
  else if (a === 'drawer') {
    const k = el.dataset.kind, oi = +el.dataset.oi;
    const html = k === 'ben' ? drawerBen(oi, el.dataset.sid, el.dataset.bid)
      : k === 'var' ? drawerVar(oi) : k === 'rider' ? drawerRider(oi, el.dataset.sid, el.dataset.tid) : drawerStd(el.dataset.sid);
    openDrawer(html, el.closest('#drawer') ? null : el);
  }
  else if (a === 'cell') {
    const g = el.dataset.g, t = el.dataset.t;
    openDrawer(stdList(`${GL[g]} ${t}`, `사전에 있는 이 칸의 표준담보와 세 회사의 보유 상태입니다. ${who()} 기준.`, D.stds.filter(s => D.std[s].group === g && D.std[s].type === t)), el);
  }
  else if (a === 'list') {
    const ins = P().ins, k = el.dataset.list;
    const sids = k === 'diff' ? ins.diff.map(x => x.sid) : ins[k];
    const title = { gap: '우체국 빈자리', uniq: '우체국에만 있는 담보', diff: '면책이나 감액이 다른 담보' }[k];
    openDrawer(stdList(title, `${who()} 기준, ${sids.length}개.`, sids), el);
  }
  else if (a === 'close') closeDrawer();
});
$('#scrim').addEventListener('click', closeDrawer);
const ageIn = $('#age');
ageIn.addEventListener('change', () => setCond({ age: parseInt(ageIn.value, 10) || S.age }));
ageIn.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); setCond({ age: S.age + (e.key === 'ArrowUp' ? 1 : -1) }); }
  else if (e.key === 'Enter') { e.preventDefault(); setCond({ age: parseInt(ageIn.value, 10) || S.age }); }
});
$('#theme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  const apply = () => { document.documentElement.dataset.theme = next; syncTheme(); };
  if (document.startViewTransition && !reduce()) document.startViewTransition(apply).ready.catch(() => {}); else apply();
  try { localStorage.setItem('postlife-proto-theme', next); } catch (e) {}
});
function syncTheme() {
  const light = document.documentElement.dataset.theme === 'light';
  const b = $('#theme');
  b.textContent = light ? '어두운 콘솔 모드' : '밝은 문서 모드';
  b.setAttribute('aria-pressed', light);
}
['pointerdown', 'keydown'].forEach(t => addEventListener(t, () => { if (vt) { try { vt.skipTransition(); } catch (e) {} } }, true));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && closeDrawer()) { e.preventDefault(); return; }

    if (e.key === 'Tab') {
      const f = $$('#drawer button, #drawer [href], #drawer [tabindex]:not([tabindex="-1"])').filter(x => x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }

  }
  if (e.target.closest && e.target.closest('#inv') && ['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) {
    const rows = $$('#inv .row:not([hidden])'), i = rows.findIndex(r => r.dataset.sid === S.sel);
    const j = e.key === 'Home' ? 0 : e.key === 'End' ? rows.length - 1 : Math.max(0, Math.min(rows.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
    e.preventDefault(); select(rows[j].dataset.sid); rows[j].focus(); return;
  }
  if (e.key === '1') go('brief');
  else if (e.key === '2') go('cmp');
  else if (e.key === '3') go('focus');
  else if ((e.key === 'f' || e.key === 'F') && S.view === 'cmp') enterFocus(S.sel, $('.det-name'));
});
function setStick() {
  const top = $('.top'), cond = $('#cond');
  const h = (getComputedStyle(top).position === 'sticky' ? top.offsetHeight : 0) + cond.offsetHeight;
  document.documentElement.style.setProperty('--stick', h + 'px');
}
addEventListener('resize', () => { cancelAnimationFrame(setStick.raf); setStick.raf = requestAnimationFrame(setStick); });

/* ---------- 시작 ---------- */
try { const t = localStorage.getItem('postlife-proto-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
syncTheme();
buildCond();

const vb = $('#v-brief');
if (!reduce()) vb.classList.add('pre');

requestAnimationFrame(() => requestAnimationFrame(() => {
  performance.mark('brief-in');

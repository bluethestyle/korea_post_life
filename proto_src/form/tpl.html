/* A4 세로 인쇄용. 단위는 mm 와 pt. 본문 9.5pt, 주석 8pt 이상. */
@page { size: A4; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--kp-paper-deep);
  font-family: var(--font-body);
  color: var(--text-default);
  font-size: 9.5pt;
  line-height: 1.42;
  word-break: keep-all;
  overflow-wrap: break-word;
  font-variant-numeric: tabular-nums;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
@media print { body { background: var(--bg-base); } }
p, h1, h2, h3, ul, ol, table { margin: 0; padding: 0; }
ul { list-style: none; }
b, strong { font-weight: 600; }
a { color: inherit; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.ic { display: inline-block; flex: none; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.red { color: var(--kp-red-600); }
.mut { color: var(--fg-muted); }
.sm { font-size: 8pt; line-height: 1.38; }
.nw { white-space: nowrap; }
u { text-decoration: none; border-bottom: 0.5mm solid var(--kp-red); }
.arw { display: inline-block; width: 1em; height: 0.62em; vertical-align: 0.02em; margin: 0 0.12em; }
.circ { display: inline-flex; width: 1.05em; height: 1.05em; border: 0.08em solid currentColor; border-radius: 50%; align-items: center;
  justify-content: center; font-size: 8pt; line-height: 1; vertical-align: 0.05em; margin: 0 0.05em; }

/* 쪽 */
.page {
  width: 210mm; height: 297mm; margin: 0 auto; padding: 9mm 12mm 0;
  background: var(--bg-base); display: flex; flex-direction: column; overflow: hidden;
  break-after: page; page-break-after: always; position: relative;
}
.page:last-child { break-after: auto; page-break-after: auto; }
@media screen { .page { margin: 6mm auto; box-shadow: 0 0.5mm 3mm rgba(0,0,0,0.18); } }
.doctitle { text-align: center; font-size: 15pt; font-weight: 600; letter-spacing: 0.04em; padding: 0 0 3mm; }

/* 양식 표: 두 열, 바깥 테두리 */
.frame {
  flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 30mm minmax(0, 1fr);
  border: 0.5mm solid var(--text-default);
}
.frame > div { border-bottom: 0.25mm solid var(--border-default); min-width: 0; }
.frame > .th {
  background: var(--kp-paper-deep); text-align: center; font-weight: 600; font-size: 9.5pt;
  padding: 1.2mm 0; letter-spacing: 0.35em; border-bottom: 0.35mm solid var(--text-default);
}
.frame > .th.l { border-right: 0.25mm solid var(--border-default); }
.frame > .lc {
  background: var(--kp-paper); border-right: 0.25mm solid var(--border-default);
  padding: 2mm 2.2mm; font-weight: 600; display: flex; flex-direction: column; justify-content: center;
}
.frame > .lc.top { justify-content: flex-start; }
.frame > .rc { padding: 2mm 3mm; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
.frame > .rc.body { justify-content: flex-start; padding: 2.4mm 3mm 2mm; gap: 2mm; }
.frame > .last { border-bottom: 0; }
.guide { font-size: 8pt; font-weight: 400; color: var(--fg-muted); line-height: 1.35; margin-top: 1mm; }
.guide .go { display: block; color: var(--kp-red-600); font-weight: 600; margin: 0.4mm 0 1.4mm; }
.lc .cont { font-size: 8pt; color: var(--fg-muted); font-weight: 600; }
.lc .topic { font-size: 10.5pt; margin: 1mm 0 3mm; line-height: 1.3; }

/* 왼쪽 열의 목차 레일 */
.rail { margin-top: 2mm; display: flex; flex-direction: column; gap: 1.1mm; font-weight: 400; }
.rail .it { display: flex; gap: 1.3mm; align-items: baseline; font-size: 8pt; color: var(--fg-muted); line-height: 1.3; }
.rail .n { flex: none; width: 3.8mm; height: 3.8mm; border-radius: 50%; border: 0.25mm solid var(--border-default);
  font-size: 8pt; display: inline-flex; align-items: center; justify-content: center; line-height: 1; transform: translateY(0.6mm); }
.rail .it.on { color: var(--text-default); font-weight: 600; }
.rail .it.on .n { background: var(--kp-red); border-color: var(--kp-red); color: #fff; }
.rail .pg { margin-left: auto; flex: none; }

/* 꼬리말: 평가기준 알약 넷과 쪽 번호 */
.ft { height: 11mm; flex: none; display: flex; align-items: center; justify-content: space-between; font-size: 8pt; color: var(--fg-muted); }
.ft .crit { display: flex; gap: 1.2mm; align-items: center; }
.ft .crit .lab { margin-right: 0.8mm; }

.cp.on { background: var(--kp-ink); color: #fff; border: 0.25mm solid var(--kp-ink); }
.cp.off { color: var(--border-default); border: 0.25mm dashed var(--border-default); }
.cp.b { background: var(--kp-paper-deep); color: var(--text-default); border: 0.25mm solid var(--kp-paper-deep); }
.cp.bm { background: var(--kp-ink); color: #fff; border: 0.25mm solid var(--kp-ink); }
.ft .pgno { font-weight: 600; color: var(--text-default); }

/* 블록 공통 */
.tag { font-size: 8pt; font-weight: 600; color: var(--kp-red-600); letter-spacing: 0.02em; }
.hl { font-size: 12.5pt; font-weight: 600; line-height: 1.32; }
.bh { display: flex; align-items: center; gap: 1.4mm; font-size: 10.5pt; font-weight: 600; line-height: 1.3;

.bh .sp { flex: 1; }

.band { background: var(--kp-paper); padding: 1.6mm 2.4mm; display: flex; gap: 2.4mm; align-items: baseline; }
.band .k { font-weight: 600; flex: none; }

.chip.ink { background: var(--kp-ink); color: #fff; }
.chip.line { border: 0.25mm solid var(--kp-ink); }
.chip.paper { background: var(--kp-paper-deep); }
.chip.dash { border: 0.25mm dashed var(--fg-muted); color: var(--fg-muted); }

.badge-um { display: inline-flex; align-items: center; font-size: 8pt; font-weight: 600; line-height: 1; padding: 0.9mm 1.8mm;
  border-radius: 2mm; border: 0.3mm dashed var(--kp-ink); color: var(--kp-ink); white-space: nowrap; }
.role { display: inline-flex; align-items: center; justify-content: center; font-size: 8pt; line-height: 1; padding: 0.8mm 1.5mm; border-radius: 1mm; white-space: nowrap; font-weight: 600; }
.role.ai { background: var(--kp-ink); color: #fff; border: 0.25mm solid var(--kp-ink); }
.role.code { border: 0.25mm solid var(--kp-ink); color: var(--kp-ink); }
.role.hum { background: var(--kp-paper-deep); border: 0.25mm solid var(--kp-paper-deep); color: var(--kp-ink); }
.num { font-weight: 600; letter-spacing: -0.01em; }
.big { font-size: 20pt; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
.big .u { font-size: 10pt; margin-left: 0.6mm; letter-spacing: 0; }
.shot { position: relative; background-size: cover; background-position: center top; border: 0.25mm solid var(--border-default); }
.shot.hero { border: 0.6mm solid var(--kp-red); }
.dot { position: absolute; width: 4.4mm; height: 4.4mm; margin: -2.2mm 0 0 -2.2mm; border-radius: 50%;
  background: var(--kp-red); color: #fff; font-size: 8pt; font-weight: 600; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 0.4mm #fff; }
.zone { position: absolute; border: 0.35mm solid var(--kp-red); background: rgba(218, 41, 28, 0.08); }
.zone .zn { position: absolute; left: -0.35mm; top: -4.6mm; background: var(--kp-red); color: #fff; font-size: 8pt; font-weight: 600; line-height: 1;
  padding: 0.6mm 1.3mm; border-radius: 0.8mm; }
.ocard { border: 0.25mm solid var(--border-default); border-top: 0.6mm solid var(--kp-ink); padding: 1.8mm 2.2mm; background: var(--bg-base); }

/* 1쪽 */
.p1-lead { font-size: 12.5pt; font-weight: 600; line-height: 1.38; }
.p1-intro { display: grid; grid-template-columns: 28mm 1fr; row-gap: 1mm; }
.p1-intro .k { font-weight: 600; font-size: 9.5pt; color: var(--kp-ink); background: var(--kp-paper); padding: 0.6mm 1.6mm; align-self: start; margin-right: 2mm; }
.p1-flow { display: flex; align-items: stretch; gap: 0; }
.p1-flow .node { display: flex; flex-direction: column; align-items: center; text-align: center; }
.p1-flow .fig { height: 34mm; display: flex; align-items: flex-end; justify-content: center; }
.p1-flow .lab { font-weight: 600; font-size: 10pt; margin-top: 1.4mm; }

.openl { display: flex; align-items: center; gap: 2mm; flex-wrap: wrap; margin-top: 1.6mm; padding: 1.2mm 2.4mm; border: 0.3mm solid var(--kp-ink); background: var(--kp-paper); }

.caution { font-size: 8pt; color: var(--fg-muted); display: flex; gap: 1.2mm; align-items: flex-start; }

/* 기본 표(행 1~5) */
.check { display: flex; flex-wrap: wrap; gap: 1mm 5mm; }

.p2-chips { display: grid; grid-template-columns: 1.45fr 1fr 1fr; gap: 2mm; }

.wcard { border-top: 0.6mm solid var(--kp-ink); background: var(--kp-paper); padding: 1.6mm 2mm 2mm; display: flex; flex-direction: column; gap: 1.2mm; }
.wcard .t { font-weight: 600; font-size: 9.5pt; display: flex; gap: 1.2mm; align-items: baseline; }
.wcard .t .i { flex: none; width: 4mm; height: 4mm; border-radius: 50%; background: var(--kp-ink); color: #fff; font-size: 8pt; display: inline-flex; align-items: center; justify-content: center; line-height: 1; transform: translateY(0.4mm); }
.qrow { display: flex; flex-direction: column; gap: 0.2mm; padding-bottom: 1mm; border-bottom: 0.25mm solid var(--border-subtle); }
.qrow .o { display: flex; gap: 1.2mm; align-items: baseline; }

.ncard .o { display: block; font-size: 8pt; font-weight: 600; color: var(--fg-muted); }

.p2-needs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2.4mm; }
.need { display: flex; flex-direction: column; align-items: stretch; }
.need .ask { background: var(--kp-paper); border-radius: 2.4mm; padding: 1.6mm 2.4mm; font-weight: 600; text-align: center; position: relative; }
.need .ask::after { content: ""; position: absolute; left: 50%; bottom: -1.8mm; margin-left: -1.8mm; border: 1.8mm solid transparent; border-bottom: 0; border-top-color: var(--kp-paper); }
.need .down { text-align: center; color: var(--fg-muted); height: 6mm; display: flex; align-items: center; justify-content: center; }
.need .card { border: 0.25mm solid var(--border-default); border-top: 0.6mm solid var(--kp-ink); padding: 1.8mm 2.2mm; flex: 1; display: flex; flex-direction: column; gap: 1.2mm; }
.need .card .cue { margin-top: auto; padding-top: 1.2mm; display: flex; flex-direction: column; gap: 0.6mm; }
.need .card .cue .shot { border: 0.35mm solid var(--kp-ink); }
.need .card .tab { display: flex; align-items: center; gap: 1.2mm; font-weight: 600; font-size: 10pt; }

/* 3쪽 */
.p3-grid { display: grid; grid-template-columns: 92mm 1fr; gap: 3mm; }
.ladder { display: flex; flex-direction: column; gap: 0.9mm; position: relative; }

.step.hero { border: 0.35mm solid var(--kp-red); }
.step .no { width: 6.4mm; height: 6.4mm; border-radius: 50%; background: var(--kp-ink); color: #fff; font-weight: 600; font-size: 9.5pt; display: flex; align-items: center; justify-content: center; }
.step.hero .no { background: var(--kp-red); }
.step .nm { display: flex; align-items: center; gap: 1.2mm; font-weight: 600; font-size: 10.5pt; line-height: 1.2; }

.step .tl { font-size: 8pt; color: var(--fg-muted); line-height: 1.3; margin-top: 0.3mm; }

.order .ar { width: 5mm; flex: none; display: flex; align-items: center; justify-content: center; color: var(--fg-muted); }

<!doctype html>
<html lang="ko" data-skin="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>관계망 탐색</title>
<style>/*__FONTS__*/</style>
<style>
:root{--f-ko:"PLBody","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-num:"PLNum","PLBody",monospace;--f-wide:"PLWide","PLNum",sans-serif;
  --hd-bg:#050913;--hd-text:#e3eaf1;--hd-2:#8fa2b8;--hd-btn:#0a1430;--hd-bd:rgba(89,137,213,.45);
  --bg:#0b0f12;--bg-2:#070b16;--grid:rgba(120,160,210,.055);--dot:rgba(140,185,230,.17);
  --panel:#060c22;--panel-2:#0a1534;--panel-3:#01042d;--head:#032dbf;--head-2:#011f8f;--sel:#0e67ff;--sel-soft:#103b70;
  --line:#03bef1;--line-dim:rgba(3,190,241,.3);--frame:rgba(89,137,213,.6);--num:#02c9ff;
  --text:#e3eaf1;--text-2:#a9b8c8;--text-3:#7f90a6;--off:#676e76;--amber:#dd9409;--yellow:#d8b732;--red:#ff4a5d;--green:#22d36b;
  --edge:#4d6788;--node-fill:#071233;--lbl-bg:#081130;--lbl-bd:rgba(3,190,241,.35);--orbit:rgba(3,190,241,.16);--orbit-2:rgba(3,190,241,.07);
  --o-EPOST:#ff5f66;--o-HANWHALIFE:#ffa63d;--o-SAMSUNGFIRE:#4aa3ff;--o-OTHER:#b59cff;--o-none:#7fb7e8;--shadow:0 10px 30px rgba(0,0,0,.55)}
[data-skin=light]{--hd-bg:#0b1528;--hd-btn:#15223d;--bg:#e6ecf5;--bg-2:#dbe3ee;--grid:rgba(11,21,40,.06);--dot:rgba(11,21,40,.17);
  --panel:#ffffff;--panel-2:#f1f5fb;--panel-3:#e8eef7;--head:#0b1528;--head-2:#16233d;--sel:#1d4ed8;--sel-soft:#dbe6ff;
  --line:#1d4ed8;--line-dim:rgba(29,78,216,.28);--frame:rgba(11,21,40,.3);--num:#1d4ed8;
  --text:#0b1528;--text-2:#34445d;--text-3:#56657c;--off:#8a96a8;--amber:#a85d00;--red:#c81e3a;--green:#0f8a43;
  --edge:#8394ab;--node-fill:#ffffff;--lbl-bg:#ffffff;--lbl-bd:rgba(11,21,40,.22);--orbit:rgba(29,78,216,.18);--orbit-2:rgba(29,78,216,.08);
  --o-EPOST:#c92a2a;--o-HANWHALIFE:#b45f00;--o-SAMSUNGFIRE:#1c5bd6;--o-OTHER:#6c5fa7;--o-none:#33445e;--shadow:0 10px 30px rgba(11,21,40,.18)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f-ko);font-size:15px;-webkit-tap-highlight-color:transparent}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.wide{font-family:var(--f-wide);letter-spacing:.08em}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100%}
/* ---------- header ---------- */
#hd{position:relative;z-index:8;display:flex;align-items:center;gap:10px 14px;padding:8px 16px 9px;background:var(--hd-bg);color:var(--hd-text);flex-wrap:wrap}
#hd .hd-line{position:absolute;left:0;right:0;bottom:0;height:1px;background:linear-gradient(90deg,var(--line) 0,var(--line) 22%,rgba(3,190,241,.25) 60%,rgba(3,190,241,.1));transform-origin:0 50%}
#hd .hd-line:after{content:"";position:absolute;left:0;top:-3px;width:220px;height:3px;background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 5px);opacity:.7}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.crumb{font:400 11px/1 var(--f-wide);letter-spacing:.14em;color:var(--hd-2);white-space:nowrap}
.crumb b{color:#02c9ff;font-weight:400}
.brand h1{margin:0;font:600 20px/1.15 var(--f-ko);letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand h1:before{content:"";width:10px;height:10px;border:1.5px solid #02c9ff;transform:rotate(45deg);flex:none}
.srch{position:relative;flex:1 1 240px;min-width:0;max-width:420px}
.srch input{width:100%;height:44px;border:1px solid var(--hd-bd);background:var(--hd-btn);color:#fff;padding:0 12px 0 34px;font:400 15px var(--f-ko);outline:none;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.srch input::placeholder{color:#8496ad}
.srch input:focus{border-color:#02c9ff;background:#0b1a3e}
.srch:before{content:"";position:absolute;left:12px;top:15px;width:10px;height:10px;border:1.5px solid #02c9ff;border-radius:50%;z-index:1;pointer-events:none}
.srch:after{content:"";position:absolute;left:22px;top:26px;width:6px;height:1.5px;background:#02c9ff;transform:rotate(45deg);z-index:1;pointer-events:none}
#sugg{position:absolute;left:0;right:0;top:48px;background:var(--panel);color:var(--text);border:1px solid var(--frame);box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none;z-index:30}
#sugg button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-bottom:1px solid var(--line-dim);min-height:44px;font-size:15px}
#sugg button:hover,#sugg button:focus-visible{background:var(--sel-soft);outline:none}
#sugg .kd{font:500 12px var(--f-num);letter-spacing:.06em;padding:2px 6px;border:1px solid currentColor;white-space:nowrap}
#sugg .og{margin-left:auto;color:var(--text-2);font-size:14px;white-space:nowrap}
.hb{display:flex;gap:6px}
.hbtn,.seg button{height:44px;padding:0 14px;border:1px solid var(--hd-bd);background:var(--hd-btn);color:#dfe8f2;white-space:nowrap;font-size:15px;position:relative;transition:background .12s,border-color .12s,transform .08s}
.hbtn{clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,0 100%)}
.hbtn:hover,.seg button:hover{border-color:#02c9ff;background:#0d1d48}
.hbtn:active,.seg button:active{transform:scale(.95);background:#0e67ff}
.hbtn:disabled{opacity:.45;border-style:dashed}
.hbtn .k{font:500 12px var(--f-num);color:#02c9ff;margin-right:6px}
.seg{display:flex;align-items:center;gap:0}
.seg .sl{font:400 11px var(--f-wide);letter-spacing:.14em;color:var(--hd-2);margin-right:8px;writing-mode:horizontal-tb}
.seg button{padding:0 12px;margin-left:-1px}
.seg button:first-of-type{clip-path:polygon(9px 0,100% 0,100% 100%,0 100%,0 9px)}
.seg button:last-of-type{clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}
.seg button.on{background:#0e67ff;border-color:#5aa0ff;color:#fff;z-index:1}
.seg button.on:before{content:"";position:absolute;left:8px;right:8px;top:0;height:3px;background:repeating-linear-gradient(90deg,#9fdcff 0 2px,transparent 2px 4px)}
.stamp{display:flex;flex-direction:column;gap:3px;align-items:flex-end;margin-left:auto}
.stamp span{font:400 11px var(--f-wide);letter-spacing:.14em;color:var(--hd-2)}
.stamp b{font:500 15px var(--f-num);color:#02c9ff}
/* ---------- trail ---------- */
#trail{position:relative;z-index:7;display:flex;align-items:center;gap:4px;padding:4px 16px;background:var(--bg-2);border-bottom:1px solid var(--line-dim);overflow-x:auto;white-space:nowrap;min-height:52px;scrollbar-width:none}
#trail::-webkit-scrollbar{display:none}
#trail .tl{font:400 11px var(--f-wide);letter-spacing:.16em;color:var(--text-3);margin-right:10px;display:flex;align-items:center;gap:8px}
#trail .tl:before{content:"";width:3px;height:18px;background:var(--line)}
#trail button{display:flex;align-items:center;gap:8px;height:44px;border:1px solid var(--line-dim);background:var(--panel);padding:0 14px 0 10px;max-width:240px;color:var(--text);font-size:15px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:transform .08s}
#trail button span:last-child{overflow:hidden;text-overflow:ellipsis}
#trail button .ix{font:500 13px var(--f-num);color:var(--num)}
#trail button:hover{border-color:var(--line)}
#trail button:active{transform:scale(.96)}
#trail button.cur{background:var(--sel);border-color:var(--sel);color:#fff}
#trail button.cur .ix{color:#bfe9ff}
#trail .sep{color:var(--text-3);font:500 14px var(--f-num);letter-spacing:-2px}
#trail .muted{color:var(--text-2)}
/* ---------- canvas ---------- */
#cv{flex:1;position:relative;min-height:0;overflow:hidden;background-color:var(--bg);
  background-image:radial-gradient(ellipse at 45% 45%,transparent 0,transparent 55%,rgba(0,0,0,.28) 100%),radial-gradient(var(--dot) 1px,transparent 1.2px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100% 100%,24px 24px,96px 96px,96px 96px}
[data-skin=light] #cv{background-image:radial-gradient(var(--dot) 1px,transparent 1.2px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px,96px 96px,96px 96px}
svg#g{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.cvf{position:absolute;inset:10px;pointer-events:none;z-index:1}
.cvf i{position:absolute;width:22px;height:22px;border-color:var(--line);border-style:solid;border-width:0;opacity:.7}
.cvf .a{left:0;top:0;border-top-width:1.5px;border-left-width:1.5px}.cvf .b{right:0;top:0;border-top-width:1.5px;border-right-width:1.5px}
.cvf .c{left:0;bottom:0;border-bottom-width:1.5px;border-left-width:1.5px}.cvf .d{right:0;bottom:0;border-bottom-width:1.5px;border-right-width:1.5px}
/* frame: chamfered 1px panel */
.frm{position:absolute;background:var(--panel);border:1px solid var(--frame);clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);box-shadow:var(--shadow)}
.frm:after{content:"";position:absolute;right:-1px;bottom:6px;width:20px;height:1px;background:var(--frame);transform:rotate(-45deg);transform-origin:100% 50%}
.tag{font:400 11px var(--f-wide);letter-spacing:.14em;color:var(--text-3);white-space:nowrap}
/* filter */
#filt{position:absolute;left:22px;top:20px;z-index:5}
#ftog{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:1px solid var(--frame);background:var(--panel);color:var(--text);font-size:15px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
#ftog .num{color:var(--num);font-size:14px}
#ftog:active{transform:scale(.96)}
#fpop{position:absolute;left:0;top:52px;width:max-content;max-width:min(560px,calc(100vw - 44px));padding:12px 14px 14px;display:none}
#fpop.open{display:block}
#fpop .row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.fc{height:44px;padding:0 12px;border:1px solid var(--line-dim);background:var(--panel-2);color:var(--text);display:flex;align-items:center;gap:8px;font-size:15px;clip-path:polygon(7px 0,100% 0,100% 100%,0 100%,0 7px)}
.fc.on{border-color:var(--line);background:var(--sel-soft)}
.fc:not(.on){color:var(--text-3);text-decoration:line-through}
.fc i{width:10px;height:10px;display:inline-block;transform:rotate(45deg)}
.fc:active{transform:scale(.95)}
/* hud */
#hud{position:absolute;top:20px;z-index:4;display:flex;gap:2px;pointer-events:none}
#hud div{padding:5px 10px 6px;background:var(--panel);border:1px solid var(--line-dim);min-width:74px}
#hud span{display:block;font:400 11px var(--f-wide);letter-spacing:.12em;color:var(--text-3)}
#hud b{font:500 17px var(--f-num);color:var(--num)}
#hud b small{font-size:11px;color:var(--text-3);margin-left:2px}
/* minimap */
#miniw{left:22px;bottom:22px;width:150px;height:118px;z-index:4;padding:0}
#miniw .tag{position:absolute;left:8px;top:6px;z-index:1}
#mini{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
/* zoom */
.zb{position:absolute;bottom:22px;display:flex;flex-direction:column;gap:4px;z-index:4}
.zb button{width:48px;height:48px;border:1px solid var(--frame);background:var(--panel);color:var(--text);font:500 20px var(--f-num);clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.zb button.fit{font:400 11px var(--f-wide);letter-spacing:.08em}
.zb button:hover{border-color:var(--line)}
.zb button:active{transform:scale(.93);background:var(--sel);color:#fff}
/* dock */
#dock{position:absolute;bottom:22px;z-index:6;display:flex;align-items:stretch;gap:0;padding:0;min-height:76px;overflow:visible;clip-path:none}
#dock[hidden]{display:none}
#dock .dk-frame{position:absolute;inset:0;background:var(--panel);border:1px solid var(--frame);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);box-shadow:var(--shadow)}
#dock .dk-frame:before{content:"";position:absolute;left:14px;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--line) 0 30%,transparent 30% 34%,var(--line-dim) 34% 100%)}
#dock .dk-tag{position:absolute;left:18px;top:-18px;font:400 11px var(--f-wide);letter-spacing:.14em;color:var(--text-3);white-space:nowrap}
#dock .dk-tag b{color:var(--num);font-weight:400}
#dock>*:not(.dk-frame):not(.dk-tag):not(#hopm){position:relative}
.dk-wrap{display:contents}
.dk-id{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;width:172px;flex:none;border-right:1px solid var(--line-dim)}
.dk-id svg{width:32px;height:32px;flex:none;overflow:visible}
.dk-id .nm{font:600 15px/1.25 var(--f-ko);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.dk-id .sb{font-size:13px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-rel{display:flex;align-items:center;gap:6px;padding:10px 10px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.dk-rel::-webkit-scrollbar{display:none}
.dk-act{display:flex;align-items:center;gap:5px;padding:10px 12px 10px 8px;border-left:1px solid var(--line-dim);flex:none}
.rb,.ab{position:relative;height:54px;border:1px solid var(--line-dim);background:var(--panel-2);color:var(--text);display:flex;align-items:center;gap:7px;padding:0 11px 0 9px;white-space:nowrap;flex:none;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));transition:background .12s,border-color .12s,color .12s,transform .08s}
.rb .ky{font:500 12px var(--f-num);width:20px;height:20px;display:grid;place-items:center;border:1px solid var(--line-dim);color:var(--text-2)}
.rb .nm{font:600 15px var(--f-ko)}
.rb .ct{font:500 20px var(--f-num);color:var(--num);min-width:18px;text-align:right}
.rb .dr{font:500 14px var(--f-num);color:var(--text-3)}
.rb .sp{position:absolute;left:10px;right:12px;bottom:4px;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 5px);opacity:0}
.rb:hover,.ab:hover{border-color:var(--line);background:var(--sel-soft)}
.rb:hover .ky{border-color:var(--line);color:var(--num)}
.rb:active,.ab:active{transform:scale(.95);background:var(--sel);color:#fff;border-color:var(--sel)}
.rb:active .ct,.rb:active .dr{color:#fff}
.rb.on{background:var(--sel);border-color:#5aa0ff;color:#fff}
.rb.on .ct{color:#d6f3ff}.rb.on .dr,.rb.on .ky{color:#d6f3ff;border-color:rgba(255,255,255,.5)}
.rb.on .sp{opacity:.9;background:repeating-linear-gradient(90deg,#bfe9ff 0 3px,transparent 3px 5px)}
.rb:disabled,.ab:disabled{opacity:.42;border-style:dashed;background:transparent;cursor:default;transform:none}
.ab{font-size:14px;padding:0 9px;flex-direction:column;justify-content:center;gap:3px;min-width:50px}
.ab .ic{font:500 14px/1 var(--f-num);color:var(--num)}
.ab.on{background:var(--sel);color:#fff;border-color:#5aa0ff}.ab.on .ic{color:#d6f3ff}
.ab.amb{border-color:var(--amber);color:var(--amber)}
#hopm{position:absolute;right:10px;bottom:calc(100% + 10px);width:330px;padding:10px;display:none;z-index:9}
#hopm.open{display:block}
#hopm .frm{position:absolute;inset:0;z-index:-1}
#hopm .hi{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;text-align:left;border:1px solid var(--line-dim);background:var(--panel-2);color:var(--text);padding:6px 12px;margin-top:6px;font-size:15px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
#hopm .hi:hover{border-color:var(--line);background:var(--sel-soft)}
#hopm .hi:active{transform:scale(.97);background:var(--sel);color:#fff}
#hopm .hi b{font:500 13px var(--f-num);color:var(--num);border:1px solid var(--line-dim);padding:3px 6px;flex:none}
/* panel */
#panel{right:22px;top:20px;bottom:22px;width:330px;z-index:6;overflow:auto;padding:0 0 18px;scrollbar-width:thin}
#panel:before{content:"";position:absolute;left:0;top:44px;bottom:30px;width:3px;background:var(--line);opacity:.85}
.ph{position:sticky;top:0;z-index:1;background:var(--panel)}
.ph .bar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 6px 18px}
.ph .hd{margin:0 0 0 0;padding:7px 14px 7px 18px;background:linear-gradient(90deg,var(--head) 0,var(--head) 72%,rgba(3,45,191,0) 100%);color:#fff;font:600 15px var(--f-ko);display:flex;align-items:center;gap:8px}
[data-skin=light] .ph .hd{background:var(--head);margin-right:40px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 100%,0 100%)}
.ph .hd:before{content:"";width:7px;height:7px;background:#02c9ff;transform:rotate(45deg)}
.ph .t{padding:12px 16px 2px 18px;font:600 19px/1.35 var(--f-ko);word-break:keep-all;overflow-wrap:anywhere}
.ph .s{padding:2px 16px 12px 18px;color:var(--text-2);font-size:15px;display:flex;align-items:center;gap:8px}
.ph .s i{width:9px;height:9px;transform:rotate(45deg);display:inline-block}
.sec{padding:10px 16px 6px 18px}
.sh{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.sh h3{margin:0;font:600 15px var(--f-ko);color:var(--text)}
.sh .tag{margin-left:auto}
.sh:after{content:"";flex:none;width:0}
.rule{height:1px;background:linear-gradient(90deg,var(--line-dim),var(--line-dim) 60%,transparent);margin:0 0 6px;position:relative}
.rule:before{content:"";position:absolute;left:0;top:-2px;width:24px;height:5px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 4px)}
.kv{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line-dim);font-size:15px}
.kv .k{color:var(--text-2)}
.kv .v{text-align:right;color:var(--text)}
.kv .v.n{font:500 16px var(--f-num);color:var(--num)}
.kv.long{grid-template-columns:1fr}
.kv.long .v{text-align:left;margin-top:3px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.gg{margin:4px 0 10px}
.gr{display:grid;grid-template-columns:40px 1fr 92px;align-items:center;gap:10px;padding:6px 0}
.gr .k{color:var(--text-2);font-size:15px}
.gr .v{text-align:right;font:500 15px var(--f-num);color:var(--num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr.warn .v{color:var(--amber)}
.trk{height:12px;position:relative;background:var(--panel-3);border:1px solid var(--line-dim);overflow:hidden}
.trk i{position:absolute;left:1px;top:1px;bottom:1px;background:repeating-linear-gradient(90deg,var(--num) 0 5px,transparent 5px 7px);transform-origin:0 50%}
.gr.warn .trk i{background:repeating-linear-gradient(90deg,var(--amber) 0 5px,transparent 5px 7px)}
.m-rich .trk i,.m-calm .trk i{animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.lnk{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;border:0;border-bottom:1px solid var(--line-dim);background:none;text-align:left;padding:6px 2px;font-size:15px;color:var(--text)}
.lnk:hover{background:var(--sel-soft)}
.lnk:active{transform:scale(.98)}
.lnk .rk{font:600 14px var(--f-ko);padding:2px 8px;border:1px solid var(--line);color:var(--num);flex:none}
.lnk .num{color:var(--num);font-size:16px}
.lnk .mu{color:var(--text-2);font-size:14px;margin-left:auto;white-space:nowrap}
.lnk.sub{padding-left:16px}
.lnk.sub span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin:0 0 6px;padding:8px 12px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-weight:600;min-height:48px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.pbtn:hover{background:var(--sel-soft)}.pbtn:active{transform:scale(.97);background:var(--sel);color:#fff}
.pbtn.pri{background:#22367f;border-color:#5989d5;color:#fff}
[data-skin=light] .pbtn.pri{background:var(--head);border-color:var(--head)}
.muted{color:var(--text-2);line-height:1.6}
.hl{color:var(--amber)}
/* start */
.st{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;z-index:7;padding:0 0 18px}
.st .hd{padding:8px 16px;background:linear-gradient(90deg,var(--head) 0,var(--head) 70%,transparent);color:#fff;display:flex;align-items:center;justify-content:space-between}
.st .hd .tag{color:#bcd3ff}
.st h2{margin:14px 20px 4px;font:600 22px var(--f-ko)}
.st p{margin:0 20px 14px;color:var(--text-2);line-height:1.6}
.st .lab{display:flex;align-items:center;gap:10px;margin:6px 20px 8px;font:600 15px var(--f-ko)}
.st .lab b{font:500 24px var(--f-num);color:var(--num)}
.st .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:0 20px 14px}
.st .row button{min-height:56px;padding:6px 12px;border:1px solid var(--line-dim);background:var(--panel-2);color:var(--text);display:flex;align-items:center;gap:10px;text-align:left;font-size:15px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));transition:background .12s,transform .08s}
.st .row button svg{width:30px;height:30px;flex:none;overflow:visible}
.st .row button:hover{border-color:var(--line);background:var(--sel-soft)}
.st .row button:active{transform:scale(.96);background:var(--sel);color:#fff}
#toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:var(--panel);color:var(--text);padding:10px 16px 10px 14px;z-index:20;display:none;border:1px solid var(--frame);border-left:3px solid var(--num);box-shadow:var(--shadow);font-size:15px;max-width:calc(100% - 32px)}
#toast .tag{display:block;margin-bottom:3px;color:var(--num)}
/* ---------- svg ---------- */
.orb{fill:none;stroke:var(--orbit);stroke-width:1;vector-effect:non-scaling-stroke}
.orb.d{stroke:var(--orbit-2);stroke-dasharray:3 6}
.orbt{stroke:var(--orbit);stroke-width:1;vector-effect:non-scaling-stroke}
.orbl{font:400 11px var(--f-wide);fill:var(--text-3);letter-spacing:.12em;opacity:.7}
.lane{stroke:var(--line-dim);stroke-dasharray:4 6;vector-effect:non-scaling-stroke}
.laneh rect{fill:var(--panel);stroke:var(--line-dim)}
.laneh text{font:400 11px var(--f-wide);fill:var(--num);letter-spacing:.12em}
.nd .shp{fill:var(--node-fill);stroke-width:2.2}
.nd .in{fill:none;stroke-width:1.2;opacity:.8}
.nd .tk{stroke-width:1.6}
.nd .bdg{font:600 15px var(--f-ko);pointer-events:none}
.nd .cnt{font:500 14px var(--f-num);pointer-events:none}
.nd.sel .shp{stroke-width:3}
.nd.path .shp{stroke:var(--num)!important;stroke-width:3.4}
.nd .fd{font:500 12px var(--f-num);fill:var(--amber)}
.nd .pin{fill:var(--amber)}
.nd.off,.ed.off{display:none}
.ed .vis{stroke:var(--edge);stroke-width:1.5;fill:none}
.ed .glw{stroke:var(--num);stroke-width:9;opacity:0;stroke-linecap:round}
.ed.dash .vis{stroke-dasharray:7 5}
.ed.grp .vis{stroke-dasharray:2 5;stroke-width:2}
.ed.inc .vis{stroke:var(--line);stroke-width:1.9}
.ed.path .vis,.ed.esel .vis{stroke:var(--num);stroke-width:2.8}
.ed.path .glw,.ed.esel .glw{opacity:.2}
.ed .hit{stroke:transparent;stroke-width:22}
.cap{fill:var(--lbl-bg);stroke:var(--lbl-bd);stroke-width:1;vector-effect:non-scaling-stroke}
.lb text{font:500 14px var(--f-ko);fill:var(--text);pointer-events:none}
.lb.on .cap{fill:var(--sel);stroke:#5aa0ff}
.lb.on text{fill:#fff;font-weight:600}
.lb.pth .cap{stroke:var(--num)}
.lb .sw{stroke-width:0}
.ep{cursor:pointer}
.ep text{font:500 14px var(--f-ko);fill:var(--text-2)}
.ep text .v{font-family:var(--f-num);fill:var(--num)}
.ep.warn .cap{stroke:var(--amber);stroke-dasharray:3 2}
.ep.hi .cap{stroke:var(--num)}
.ep.hi text{fill:var(--text)}
.sd-ring{fill:none;stroke:var(--line-dim);stroke-width:1;vector-effect:non-scaling-stroke}
.sd-tick{stroke:var(--line);stroke-width:1;opacity:.5;vector-effect:non-scaling-stroke}
.sd-brk{fill:none;stroke:var(--num);stroke-width:2.2;stroke-linecap:square}
.sd-arc{fill:none;stroke:var(--line);stroke-width:3.2;opacity:.7;transition:opacity .15s,stroke-width .15s}
.sd-arc.hot{opacity:1;stroke:var(--num);stroke-width:6}
.sd-num{font:500 12px var(--f-num);fill:var(--num);text-anchor:middle}
.sd-num.hot{font-size:15px;fill:var(--text)}
.sd-rot{transform-origin:0 0}
.m-rich .sd-rot{animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sd-bloomc{transform-origin:0 0}
.m-rich .sd-bloomc{animation:bloom 2.2s ease-out infinite}
@keyframes bloom{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.sd-snap{transform-origin:0 0}
.m-rich .sd-snap{animation:snap .3s cubic-bezier(.2,1.3,.4,1) both}
.m-calm .sd-snap{animation:fade .18s ease-out both}
@keyframes snap{from{transform:scale(1.9) rotate(45deg);opacity:0}}
@keyframes fade{from{opacity:0}}
/* ---------- motion: boot assembly ---------- */
.m-rich.boot #hd{animation:wipe .5s cubic-bezier(.3,.7,.2,1) both}
.m-rich.boot #hd .hd-line{animation:scx .9s .15s cubic-bezier(.3,.7,.2,1) both}
.m-rich.boot #trail{animation:dropin .4s .22s ease-out both}
.m-rich.boot #panel{animation:slidein .5s .3s cubic-bezier(.2,.9,.25,1) both}
.m-rich.boot #miniw,.m-rich.boot .zb,.m-rich.boot #hud,.m-rich.boot #filt{animation:popin .4s .5s cubic-bezier(.2,1.3,.4,1) both}
.m-rich.boot .cvf i{animation:popin .5s .35s cubic-bezier(.2,1.3,.4,1) both}
.m-rich.boot .orb{animation:draw 1.1s .2s cubic-bezier(.3,.6,.2,1) both}
.m-rich.boot .st{animation:open .45s .4s cubic-bezier(.3,.8,.2,1) both}
.m-rich.boot .st .row button{animation:dropin .35s both;animation-delay:calc(.62s + var(--i,0)*45ms)}
.m-rich.boot #cv{animation:fade .5s both}
.m-calm.boot #hd,.m-calm.boot #panel,.m-calm.boot .st,.m-calm.boot #trail{animation:fade .3s both}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes scx{from{transform:scaleX(0)}}
@keyframes dropin{from{transform:translateY(-10px);opacity:0}}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
@keyframes popin{from{transform:scale(.85);opacity:0}}
@keyframes draw{from{stroke-dashoffset:1;stroke-dasharray:1 1}to{stroke-dashoffset:0;stroke-dasharray:1 1}}
@keyframes open{from{clip-path:inset(48% 0 48% 0);opacity:.3}to{clip-path:inset(0 0 0 0)}}
.m-rich #dock.pop .dk-frame{animation:dockin .32s cubic-bezier(.2,.9,.25,1) both}
.m-rich #dock.pop .dk-id,.m-rich #dock.pop .rb,.m-rich #dock.pop .ab{animation:dropup .3s both;animation-delay:calc(var(--i,0)*40ms + 60ms)}
.m-calm #dock.pop .dk-frame{animation:fade .2s both}
@keyframes dockin{from{clip-path:inset(0 50% 0 50%);opacity:.4}to{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}}
@keyframes dropup{from{transform:translateY(12px);opacity:0}}
.m-rich #panel.pop .sec{animation:dropin .32s both;animation-delay:calc(var(--i,0)*50ms)}
.m-rich #hopm.open{animation:dropup .22s both}
/* ---------- narrow ---------- */
@media (max-width:720px){
  #hd{padding:6px 12px 8px;gap:6px 8px}
  .crumb{display:none}.brand h1{font-size:17px}
  .stamp{display:none}
  .srch{order:5;flex:1 1 150px;max-width:none}
  .seg .sl{display:none}
  #mot{order:6}#skin{margin-left:auto}
  .hbtn,.seg button{padding:0 9px}
  #mot button{padding:0 8px}
  #trail{padding:4px 12px;min-height:50px}
  #panel{left:0;right:0;bottom:0;top:auto;width:auto;height:36%;clip-path:none;border-width:1px 0 0}
  #panel:before{display:none}
  #dock{left:0!important;right:0!important;width:auto!important;min-height:66px}
  #dock .dk-frame{clip-path:none}
  #dock .dk-tag{display:none}
  .dk-wrap{display:flex!important;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;position:relative}
  .dk-wrap::-webkit-scrollbar{display:none}
  .dk-id{width:150px;padding:6px 10px}
  .dk-id svg{width:30px;height:30px}
  .dk-id .nm{font-size:14px;-webkit-line-clamp:1}
  .rb,.ab{height:48px}
  .dk-rel{overflow:visible;flex:none;padding:8px 6px}
  .dk-act{padding:8px 10px 8px 6px}
  #miniw{display:none}
  #hud{display:none}
  #filt{left:12px;top:10px}
  .cvf{display:none}
  #hopm{right:6px;left:6px;width:auto}
  .st{top:42%}
  .st .row{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app" class="m-rich boot">
<header id="hd">
  <div class="brand"><div class="crumb">POSTLIFE <b>//</b> ONTOLOGY NAV</div><h1>관계망 탐색</h1></div>
  <div class="srch"><input id="q" type="search" placeholder="검색: 표준담보, 특약, 종형, 회사" autocomplete="off" aria-label="검색"><div id="sugg"></div></div>
  <div class="hb"><button class="hbtn" id="bUndo"><span class="k">Z</span>실행 취소</button><button class="hbtn" id="bHome">처음</button></div>
  <div class="seg" id="skin"><span class="sl">SKIN</span><button data-v="dark" class="on">다크</button><button data-v="light">라이트</button></div>
  <div class="seg" id="mot"><span class="sl">MOTION</span><button data-v="rich" class="on">풍부함</button><button data-v="calm">줄임</button><button data-v="off">끔</button></div>
  <div class="stamp"><span>SNAPSHOT</span><b id="snap"></b></div>
  <i class="hd-line"></i>
</header>
<nav id="trail"></nav>
<main id="cv">
  <svg id="g" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1L10,5L0,9L3,5z" style="fill:var(--edge)"/></marker>
      <marker id="ari" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1L10,5L0,9L3,5z" style="fill:var(--line)"/></marker>
      <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1L10,5L0,9L3,5z" style="fill:var(--num)"/></marker>
      <radialGradient id="bloomG"><stop offset=".45" style="stop-color:var(--sel);stop-opacity:0"/><stop offset=".72" style="stop-color:var(--sel);stop-opacity:.42"/><stop offset="1" style="stop-color:var(--sel);stop-opacity:0"/></radialGradient>
    </defs>
    <g id="world"><g id="lBg"></g><g id="lLane"></g><g id="lE"></g><g id="lSel"></g><g id="lN"></g><g id="lEP"></g><g id="lL"></g><g id="lFx"></g></g>
  </svg>
  <div class="cvf" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>
  <div id="filt"><button id="ftog"></button><div id="fpop" class="frm"></div></div>
  <div id="hud" aria-hidden="true"><div><span>ZOOM</span><b id="hz"></b></div><div><span>NODES</span><b id="hn"></b></div><div><span>LINKS</span><b id="he"></b></div></div>
  <div id="miniw" class="frm"><span class="tag">MAP</span><svg id="mini"></svg></div>
  <div class="zb"><button id="zIn" aria-label="확대">+</button><button id="zOut" aria-label="축소">−</button><button id="zFit" class="fit" aria-label="화면 맞추기">FIT</button></div>
  <div id="dock" hidden><div class="dk-frame"></div><div class="dk-tag">COMMAND <b>//</b> <span id="dkt"></span></div><div class="dk-wrap"><div class="dk-id"></div><div class="dk-rel"></div><div class="dk-act"></div></div><div id="hopm"></div></div>
  <aside id="panel" class="frm"></aside>
  <div id="toast"></div>
</main>
</div>
<script type="application/json" id="gdata">__DATA__</script>
<script>
"use strict";
const RAW=JSON.parse(document.getElementById('gdata').textContent);
const KIND=RAW.kinds,EK=RAW.ekinds,KEYS=RAW.keys;
const KIND_EN=['ORG','PLAN','RIDER','BENEFIT','STD COVER','DOMAIN','NEWS'];
const dec=p=>{const o={};for(const k in p)o[KEYS[+k]]=p[k];return o};
const N=RAW.nodes.map((a,i)=>({i,id:a[0],k:a[1],l:a[2],o:a[3],p:dec(a[4])}));
const E=RAW.edges.map((a,i)=>({i,s:a[0],t:a[1],k:a[2],p:dec(a[3])}));
const adj=N.map(()=>[]);E.forEach(e=>{adj[e.s].push(e.i);adj[e.t].push(e.i)});
const other=(e,i)=>E[e].s===i?E[e].t:E[e].s;
const ORGNAME={};N.forEach(n=>{if(n.k===0)ORGNAME[n.o]=n.l});
const MAIN=['EPOST','HANWHALIFE','SAMSUNGFIRE'];
const orgVar=o=>o?'var(--o-'+(MAIN.includes(o)?o:'OTHER')+')':'var(--o-none)';
const orgBadge=o=>({EPOST:'우',HANWHALIFE:'한',SAMSUNGFIRE:'삼'}[o]||(ORGNAME[o]||'?')[0]);
const orgGroup=o=>MAIN.includes(o)?o:'OTHER';
const RAD=[30,24,19,13,22,22,18];const CAP=75;
const $=s=>document.querySelector(s);
const svgNS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(svgNS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function h(t,a,txt){const e=document.createElement(t);if(a)for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k])}if(txt!=null)e.textContent=txt;return e}
const trunc=(s,n=16)=>s.length>n?s.slice(0,n-1)+'…':s;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function poly(n,r,rot){let d='';for(let k=0;k<n;k++){const a=rot+k*2*Math.PI/n;d+=(k?'L':'M')+(Math.cos(a)*r).toFixed(1)+','+(Math.sin(a)*r).toFixed(1)}return d+'Z'}
function chamf(x,y,w,hh,c){return 'M'+(x+c)+','+y+'H'+(x+w)+'V'+(y+hh-c)+'L'+(x+w-c)+','+(y+hh)+'H'+x+'V'+(y+c)+'Z'}
$('#snap').textContent=RAW.snapshot_at.slice(0,16).replace('T',' ');

/* ---------- shapes ---------- */
function drawShape(g,k,r,col,extra){const st='stroke:'+col;let s;
  switch(k){
    case 0:s=el('circle',{r,class:'shp',style:st},g);el('circle',{r:r-6,class:'in',style:st+';stroke-dasharray:2 3'},g);
      for(let a=0;a<8;a++){const t=a*Math.PI/4,r2=a%2?r+5:r+9;el('line',{x1:(Math.cos(t)*(r+2)).toFixed(1),y1:(Math.sin(t)*(r+2)).toFixed(1),x2:(Math.cos(t)*r2).toFixed(1),y2:(Math.sin(t)*r2).toFixed(1),class:'tk',style:st},g)}
      el('text',{class:'bdg','text-anchor':'middle',y:5.5,style:'fill:'+col},g).textContent=orgBadge(extra);break;
    case 1:s=el('path',{d:'M0,'+(-r)+'L'+(r*.88)+','+(-r*.55)+'L'+(r*.8)+','+(r*.28)+'L0,'+r+'L'+(-r*.8)+','+(r*.28)+'L'+(-r*.88)+','+(-r*.55)+'Z',class:'shp',style:st},g);
      el('path',{d:'M0,'+(-r*.55)+'L'+(r*.45)+',-2L0,'+(r*.55)+'L'+(-r*.45)+',-2Z',class:'in',style:st},g);el('circle',{r:2.6,style:'fill:'+col},g);break;
    case 2:s=el('path',{d:'M0,'+(-r)+'L'+r+',0L0,'+r+'L'+(-r)+',0Z',class:'shp',style:st},g);
      el('rect',{x:-4.5,y:-4.5,width:9,height:9,style:'fill:'+col},g);el('path',{d:'M'+(-r-7)+',0H'+(-r+2)+'M'+(r-2)+',0H'+(r+7),class:'tk',style:st},g);break;
    case 3:s=el('circle',{r,class:'shp',style:st},g);el('circle',{r:3.6,style:'fill:'+col},g);
      el('path',{d:'M0,'+(-r-4)+'V'+(-r+3)+'M0,'+(r-3)+'V'+(r+4)+'M'+(-r-4)+',0H'+(-r+3)+'M'+(r-3)+',0H'+(r+4),class:'tk',style:st},g);break;
    case 4:s=el('path',{d:poly(6,r,Math.PI/6),class:'shp',style:'stroke:var(--line)'},g);el('path',{d:poly(6,r-6,Math.PI/6),class:'in',style:'stroke:var(--num)'},g);
      el('path',{d:poly(6,4.5,Math.PI/6),style:'fill:var(--num)'},g);break;
    case 5:s=el('path',{d:poly(8,r,Math.PI/8),class:'shp',style:'stroke:var(--text-2)'},g);el('path',{d:poly(8,r-6,Math.PI/8),class:'in',style:'stroke:var(--text-3)'},g);break;
    case 6:s=el('path',{d:'M0,'+(-r)+'L'+(r*.95)+','+(r*.7)+'L'+(-r*.95)+','+(r*.7)+'Z',class:'shp',style:'stroke:var(--amber)'},g);el('path',{d:'M0,-5V3M0,6V8',class:'tk',style:'stroke:var(--amber)'},g);break;
    default:s=el('path',{d:chamf(-r,-r*.72,r*2,r*1.44,7),class:'shp',style:st+';stroke-dasharray:5 3'},g);el('path',{d:chamf(-r+4,-r*.72+4,r*2,r*1.44,7),class:'in',style:st+';opacity:.45'},g);
      el('text',{class:'cnt','text-anchor':'middle',y:5,style:'fill:'+col},g)}
  return s}
function iconSvg(svgEl,k,col,org){svgEl.setAttribute('viewBox','-34 -34 68 68');svgEl.textContent='';const g=el('g',{class:'nd'},svgEl);drawShape(g,k,k===0?24:k===3?17:22,col,org)}

/* ---------- state ---------- */
let VN=new Map(),VE=new Map(),trail=[],sel=null,pathFrom=null,selEdge=null,gseq=0,busy=false,pinned=new Set(),lanes=null,hotEk=-1;
const undoStack=[];let view={s:1,tx:0,ty:0},viewAnim=null;let MODE='rich';
const MF=()=>MODE==='rich'?1:MODE==='calm'?.55:0;
const filt={ek:new Set(EK.map((_,i)=>i)),org:new Set([...MAIN,'OTHER'])};
let pathE=new Set(),pathN=new Set();const sigs=[],rings=[];let hov=null;
const orgOn=i=>N[i].o==null||filt.org.has(orgGroup(N[i].o));
const nb=(i,ek)=>adj[i].filter(e=>E[e].k===ek).map(e=>({e,j:other(e,i)})).filter(x=>orgOn(x.j));
const now=()=>performance.now();
function snapshot(){undoStack.push(JSON.stringify({vn:[...VN.values()].map(v=>({...v,x:v.tx,y:v.ty,fx:v.tx,fy:v.ty,dur:0,landed:true})),ve:[...VE.values()],trail,sel,pathFrom,selEdge,pathE:[...pathE],pathN:[...pathN],gseq,pinned:[...pinned]}));if(undoStack.length>60)undoStack.shift()}
function undo(){if(busy)return;const s=undoStack.pop();if(!s){toast('되돌릴 단계가 없습니다');return}const o=JSON.parse(s);VN=new Map(o.vn.map(v=>[v.key,v]));VE=new Map(o.ve.map(v=>[v.key,v]));trail=o.trail;sel=o.sel;pathFrom=o.pathFrom;selEdge=o.selEdge;pathE=new Set(o.pathE);pathN=new Set(o.pathN);gseq=o.gseq;pinned=new Set(o.pinned);lanes=null;rebuildAll();toast('한 단계 되돌렸습니다')}
function toast(m,tag='NOTICE'){const t=$('#toast');t.innerHTML='<span class="tag">'+tag+'</span>'+esc(m);t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms*MF()));

/* ---------- layout ---------- */
function collide(x,y,extra){for(const v of VN.values()){if(Math.hypot(v.tx-x,v.ty-y)<66)return true}for(const p of extra)if(Math.hypot(p.x-x,p.y-y)<66)return true;return false}
function slots(pk,count){const p=VN.get(pk);const gp=p.parent&&VN.get(p.parent);let dir,span;
  const others=[...VN.values()].filter(v=>v.key!==pk);
  if(gp){dir=Math.atan2(p.ty-gp.ty,p.tx-gp.tx);span=Math.min(Math.PI*1.2,Math.max(Math.PI/2.6,count*0.34))}
  else if(others.length){let cx=0,cy=0;others.forEach(v=>{cx+=v.tx;cy+=v.ty});cx/=others.length;cy/=others.length;dir=Math.atan2(p.ty-cy,p.tx-cx);if(!isFinite(dir)||(Math.abs(p.tx-cx)<1&&Math.abs(p.ty-cy)<1))dir=0;span=Math.min(Math.PI*1.5,Math.max(Math.PI/2,count*0.4))}

    for(let t=0;t<14;t++){x=p.tx+Math.cos(a)*r;y=p.ty+Math.sin(a)*r;if(!collide(x,y,out))break;r+=48}out.push({x,y})}
  return out}
function spawn(p,pos,pk,delay=0){return{x:p.x,y:p.y,fx:p.x,fy:p.y,tx:pos.x,ty:pos.y,t0:now()+delay*MF(),dur:440*MF(),parent:pk,landed:false}}
function addVE(e,fresh,delay=0){const key='e'+e;if(VE.has(key))return;VE.set(key,{key,a:'n'+E[e].s,b:'n'+E[e].t,e});if(fresh&&MODE==='rich')sigs.push({ve:key,t0:now()+260+delay,dur:720})}
function descendants(vk){const out=new Set();let ch=true;while(ch){ch=false;for(const v of VN.values()){if(v.key!==vk&&!out.has(v.key)&&(v.parent===vk||out.has(v.parent))){out.add(v.key);ch=true}}}return out}
function pushSiblings(pk,pos){const p=VN.get(pk);if(!p||!p.parent||!pos.length)return;const gk=p.parent,G=VN.get(gk);if(!G)return;
  const roots=[...VN.values()].filter(v=>v.parent===gk&&v.key!==pk).map(v=>v.key);if(!roots.length)return;
  const branch=new Map();roots.forEach(rk=>{const d=descendants(rk);d.add(rk);branch.set(rk,[...d])});
  const pa=Math.atan2(p.ty-G.ty,p.tx-G.tx),rot=new Map(roots.map(r=>[r,0]));
  const posOf=(k,rk)=>{const v=VN.get(k),a=rot.get(rk);if(!a)return{x:v.tx,y:v.ty};const dx=v.tx-G.tx,dy=v.ty-G.ty,c=Math.cos(a),s=Math.sin(a);return{x:G.tx+dx*c-dy*s,y:G.ty+dx*s+dy*c}};
  for(let it=0;it<14;it++){let hit=false;
    for(const [rk,ks] of branch){if(pinned.has(rk))continue;let col=false;for(const k of ks){const q=posOf(k,rk);if(pos.some(n=>Math.hypot(n.x-q.x,n.y-q.y)<76)){col=true;break}}
      if(col){hit=true;const R=VN.get(rk);let da=Math.atan2(R.ty-G.ty,R.tx-G.tx)-pa;da=Math.atan2(Math.sin(da),Math.cos(da));rot.set(rk,rot.get(rk)+(da>=0?1:-1)*0.13)}}
    if(!hit)break}
  const t=now(),d=240*MF();let moved=0;
  for(const [rk,ks] of branch){if(!rot.get(rk))continue;moved++;for(const k of ks){const v=VN.get(k),q=posOf(k,rk);v.fx=v.x;v.fy=v.y;v.tx=q.x;v.ty=q.y;v.t0=t;v.dur=d;v.landed=true;v.ez=1}}
  return moved}
function reveal(pk,pairs,opt={}){const p=VN.get(pk),fresh=[],nk=[];
  for(const x of pairs){if(!filt.ek.has(E[x.e].k))continue;const k='n'+x.j;if(VN.has(k))addVE(x.e,true);else if(!fresh.some(f=>f.j===x.j))fresh.push(x)}
  let items=fresh,groups=[];
  if(opt.group||fresh.length>12){const b=new Map();for(const x of fresh){const key=(N[x.j].o||'-')+'|'+N[x.j].k;if(!b.has(key))b.set(key,[]);b.get(key).push(x)}
    items=[];for(const arr of b.values()){if(arr.length<=3)items.push(...arr);else groups.push(arr)}}
  const pos=slots(pk,items.length+groups.length);if(!opt.lane)pushSiblings(pk,pos);let q=0;
  for(const arr of groups){const gk='g'+(++gseq),n0=N[arr[0].j];VN.set(gk,{key:gk,n:-1,grp:{items:arr,next:0,ek:E[arr[0].e].k,org:n0.o,kind:n0.k},...spawn(p,pos[q],pk,q*35)});q++;

  return nk}
function releaseGroup(gk){const g=VN.get(gk),G=g.grp,pk=g.parent,chunk=G.items.slice(G.next,G.next+12).filter(x=>!VN.has('n'+x.j));G.next+=12;
  const pos=slots(gk,chunk.length),nk=[];chunk.forEach((x,i)=>{const k='n'+x.j;VN.set(k,{key:k,n:x.j,grp:null,...spawn(g,pos[i],gk,i*30)});addVE(x.e,true,i*30);nk.push(k)});
  if(G.next>=G.items.length){for(const v of VN.values())if(v.parent===gk)v.parent=pk;VN.delete(gk);VE.delete('ge'+gk)}
  return nk}
function collapse(vk){const d=descendants(vk);if(!d.size){toast('접을 하위 노드가 없습니다');return}snapshot();d.forEach(k=>VN.delete(k));pruneE();if(selEdge&&!VE.has(selEdge))selEdge=null;trail=trail.filter(k=>VN.has(k));const v=VN.get(vk);if(v)v.folded=0;refresh();toast('가지의 노드 '+d.size+'개를 접었습니다')}
function pruneE(){for(const [k,e] of VE)if(!VN.has(e.a)||!VN.has(e.b))VE.delete(k)}
function treeDist(from){const d=new Map();if(!from||!VN.has(from))return d;const nbr=new Map();for(const v of VN.values()){if(!nbr.has(v.key))nbr.set(v.key,[]);if(v.parent&&VN.has(v.parent)){nbr.get(v.key).push(v.parent);if(!nbr.has(v.parent))nbr.set(v.parent,[]);nbr.get(v.parent).push(v.key)}}
  d.set(from,0);const q=[from];while(q.length){const c=q.shift();for(const n of nbr.get(c)||[])if(!d.has(n)){d.set(n,d.get(c)+1);q.push(n)}}return d}
function enforceCap(protect=new Set()){let folded=0,guard=0;
  while(VN.size>CAP&&guard++<300){const keep=new Set(protect);if(sel)keep.add(sel);pinned.forEach(k=>keep.add(k));pathN.forEach(i=>keep.add('n'+i));
    for(const k of [...keep]){let c=VN.get(k);while(c&&c.parent&&!keep.has(c.parent)){keep.add(c.parent);c=VN.get(c.parent)}}
    const hasKid=new Set();for(const v of VN.values())if(v.parent)hasKid.add(v.parent);
    const leaves=[...VN.values()].filter(v=>!keep.has(v.key)&&!hasKid.has(v.key));if(!leaves.length)break;
    const dist=treeDist(sel);leaves.sort((a,b)=>(dist.get(b.key)??99)-(dist.get(a.key)??99));
    const P=leaves[0].parent,grp=leaves.filter(x=>x.parent===P);
    for(const x of grp){if(VN.size<=CAP-4)break;VN.delete(x.key);folded++;const pv=P&&VN.get(P);if(pv)pv.folded=(pv.folded||0)+1}
    pruneE()}
  if(folded){trail=trail.filter(k=>VN.has(k));setTimeout(()=>toast('화면의 노드가 '+CAP+'개를 넘어 먼 하위 노드 '+folded+'개를 요약으로 접었습니다','AUTO FOLD'),60)}}
function laneCol(made,c,bx,by){const gap=66,m=made.length,x=bx+c*330;let y0=by-(m-1)/2*gap;
  const others=[...VN.values()].filter(v=>!made.includes(v.key));
  for(let t=0;t<12;t++){let hit=false;for(let j=0;j<m;j++){const y=y0+j*gap;if(others.some(v=>Math.abs(v.tx-x)<80&&Math.abs(v.ty-y)<56)){hit=true;break}}if(!hit)break;y0+=60}
  made.forEach((k,j)=>{const v=VN.get(k);v.tx=x;v.ty=y0+j*gap});
  lanes.cols.push({x,y0,y1:y0+(m-1)*gap,c})}

async function staged(steps,lane=true){if(busy)return[];busy=true;snapshot();closeHop();refresh();const all=[];const base=VN.get(sel);const bx=base.tx,by=base.ty;if(lane)lanes={x:bx,y:by,cols:[{x:bx,y0:by,y1:by,c:0}]};let c=0;
  for(const st of steps){const made=st();all.push(...made);if(lane&&made.length)laneCol(made,++c,bx,by);enforceCap(new Set(all));refresh();ensureVisible(all.concat(sel?[sel]:[]).filter(x=>VN.has(x)));await sleep(600)}

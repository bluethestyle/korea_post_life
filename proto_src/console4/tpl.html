<!doctype html>
<html lang="ko" data-theme="light" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>영업 분석 콘솔 시안 4</title>
<style id="fonts">/*__FONTS__*/</style>
<style id="style">/*__STYLE__*/</style>
</head>
<body>
<a class="sr" href="#work-anchor">본문으로 건너뛰기</a>

<!-- 기둥과 고리에 공통으로 쓰는 빗금 무늬 정의 -->
<svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="pat-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--ink-2)" stroke-width="1.5" stroke-opacity=".55"/>
    </pattern>
    <pattern id="pat-hatch-pale" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--ink-2)" stroke-width="1.1" stroke-opacity=".32"/>
    </pattern>
  </defs>
</svg>

<!-- 층 1~3: 안개(body 바탕), 기울어진 기둥과 사선 면, 원근 격자선과 도시 지평선 바닥, 안내선 -->
<div class="bg" aria-hidden="true">
  <svg class="bg-geo" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" focusable="false">
    <defs>
      <linearGradient id="gp-a" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="var(--geo-hi)" stop-opacity=".55"/>
        <stop offset=".65" stop-color="var(--geo-lo)" stop-opacity=".22"/>
        <stop offset="1" stop-color="var(--geo-lo)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gp-b" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--geo-dark)" stop-opacity=".38"/>
        <stop offset=".7" stop-color="var(--geo-dark)" stop-opacity=".12"/>
        <stop offset="1" stop-color="var(--geo-dark)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gp-c" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--geo-hi)" stop-opacity=".42"/>
        <stop offset=".6" stop-color="var(--geo-dark)" stop-opacity=".18"/>
        <stop offset="1" stop-color="var(--geo-dark)" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="gm-r" cx=".46" cy=".50" rx=".38" ry=".38">
        <stop offset="0" stop-color="#000"/>
        <stop offset=".68" stop-color="#222"/>
        <stop offset="1" stop-color="#fff"/>
      </radialGradient>
      <mask id="gm-edge"><rect width="1920" height="1080" fill="url(#gm-r)"/></mask>
    </defs>
    <polygon points="-120,0 290,0 40,1080 -320,1080" fill="url(#gp-b)"/>
    <polygon points="110,0 410,0 170,1080 -90,1080" fill="url(#gp-a)"/>
    <polygon points="1510,0 2040,0 1760,1080 1240,1080" fill="url(#gp-b)"/>
    <polygon points="1690,0 1980,0 1680,1080 1410,1080" fill="url(#gp-c)"/>
    <polygon points="560,0 1040,0 880,320 420,320" fill="url(#gp-a)" opacity=".55"/>
    <g mask="url(#gm-edge)" fill="none" vector-effect="non-scaling-stroke">
      <path d="M290 0L40 1080M410 0L170 1080M1510 0L1240 1080M1690 0L1410 1080" stroke="var(--geo-edge)" stroke-width="1"/>
      <path d="M0 140H360M0 260H310M0 380H260M1560 140H1920M1520 260H1920M1480 380H1920M1440 500H1920" stroke="var(--geo-grid)" stroke-width="1"/>
      <path d="M64 0V1080M128 0V1080M1792 0V1080M1856 0V1080" stroke="var(--geo-grid)" stroke-width="1"/>
    </g>
  </svg>
  <svg class="floor" viewBox="0 0 1920 240" preserveAspectRatio="xMidYMax slice" focusable="false">
    <defs>
      <linearGradient id="flg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000"/>
        <stop offset=".22" stop-color="#444"/>
        <stop offset=".62" stop-color="#bbb"/>
        <stop offset="1" stop-color="#fff"/>
      </linearGradient>
      <mask id="flm"><rect width="1920" height="240" fill="url(#flg)"/></mask>
    </defs>
    <g mask="url(#flm)">
      <g fill="var(--floor-block)" opacity=".24">
        <path d="M0 92V56h90V42h110V64h80V34h140V52h95V72h130V48h115V66h160V44h120V68h140V38h135V58h110V32h155V54h130V40h210v52Z"/>
      </g>
      <g fill="var(--floor-block)" stroke="var(--floor)" stroke-width=".7" stroke-opacity=".5" opacity=".42">
        <rect x="24" y="54" width="118" height="58"/><rect x="156" y="38" width="96" height="74"/>
        <rect x="268" y="62" width="144" height="50"/><rect x="428" y="48" width="88" height="64"/>
        <rect x="1280" y="56" width="112" height="56"/><rect x="1408" y="36" width="132" height="76"/>
        <rect x="1556" y="50" width="108" height="62"/><rect x="1680" y="28" width="154" height="84"/>
      </g>
      <g fill="var(--floor-block)" stroke="var(--floor)" stroke-width=".9" stroke-opacity=".68" opacity=".58">
        <rect x="68" y="84" width="136" height="68"/><rect x="224" y="72" width="112" height="80"/>
        <rect x="1464" y="76" width="142" height="76"/><rect x="1626" y="64" width="168" height="88"/>
      </g>
      <g fill="none" stroke="var(--floor-ink)" stroke-width="1" opacity=".62" vector-effect="non-scaling-stroke" transform="translate(0,1)">
        <path d="M-1560 240L960 -540M-1200 240L960 -540M-840 240L960 -540M-480 240L960 -540M-120 240L960 -540M240 240L960 -540M600 240L960 -540M960 240L960 -540M1320 240L960 -540M1680 240L960 -540M2040 240L960 -540M2400 240L960 -540M2760 240L960 -540M3120 240L960 -540M3480 240L960 -540"/>
        <path d="M0 24H1920M0 44H1920M0 68H1920M0 98H1920M0 134H1920M0 178H1920M0 228H1920"/>
      </g>
      <g fill="none" stroke="var(--floor)" stroke-width="1" opacity=".76" vector-effect="non-scaling-stroke">
        <path d="M-1560 240L960 -540M-1200 240L960 -540M-840 240L960 -540M-480 240L960 -540M-120 240L960 -540M240 240L960 -540M600 240L960 -540M960 240L960 -540M1320 240L960 -540M1680 240L960 -540M2040 240L960 -540M2400 240L960 -540M2760 240L960 -540M3120 240L960 -540M3480 240L960 -540"/>
        <path d="M0 24H1920M0 44H1920M0 68H1920M0 98H1920M0 134H1920M0 178H1920M0 228H1920"/>
      </g>
    </g>
  </svg>
  <div class="guides" id="guides"></div>
</div>

<!-- 여는 화면: 화이트룸 안개 위에서 정사각 테두리와 마름모, 교차 기준선이 단계별로 그려진 뒤 무대로 펼쳐진다 -->
<div class="boot-loader" id="boot-loader" role="status" aria-live="polite" hidden>
  <div class="bl-emblem">
    <svg class="bl-svg" width="176" height="176" viewBox="-80 -80 160 160" aria-hidden="true" focusable="false">
      <path class="bl-axis" d="M0 -76V-54M76 0H54M0 76V54M-76 0H-54M-58 -58l12 12M58 -58l-12 12M-58 58l12 -12M58 58l-12 -12" fill="none" stroke-width="1.2"/>
      <circle class="bl-outer" r="64" fill="none" stroke-width="1" stroke-dasharray="2 4"/>
      <rect class="bl-trk" x="-44" y="-44" width="88" height="88" fill="none" stroke-width="1"/>
      <rect class="bl-arc" id="boot-arc" x="-44" y="-44" width="88" height="88" fill="none" stroke-width="2.6" pathLength="100" stroke-dasharray="10 100"/>
      <path class="bl-gold" d="M0 -38L38 0 0 38 -38 0Z" fill="none" stroke-width="1.2"/>
      <path class="bl-dia" id="boot-dia" d="M0 -31L31 0 0 31 -31 0Z" fill="none" stroke-width="2" pathLength="100" stroke-dasharray="10 100"/>
    </svg>
    <span class="bl-pct num" id="boot-pct">10%</span>
  </div>
</div>

<header class="head" id="head">
  <div class="notice" role="note">
    <span class="nt"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x=".75" y=".75" width="10.5" height="10.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 3v4M6 8.4v1" stroke="currentColor" stroke-width="1.5"/></svg><span id="notice-t">공모전 시연용 화면이며 영업 자료가 아닙니다</span></span>
  </div>
</header>

<div class="shell" id="shell">
  <!-- 진행 추적기 머리: 왼쪽(작은 경로 + 큰 제목), 가운데 오른쪽(지금 조건 한 줄 + 조건 바꾸기, 비교 범위, 범위), 맨 오른쪽(전체 값의 원) -->
  <section class="top-head" id="top-head">
    <div class="dots" aria-hidden="true"></div>
    <div class="th-left">
      <nav class="lpath" id="lpath" aria-label="현재 층 경로"></nav>
      <h1 class="th-title" id="th-title">영업 분석 요약</h1>
    </div>
    <div class="th-mid" id="th-mid"></div>
    <div class="th-total" id="th-total" hidden></div>
  </section>

  <section class="cond" id="cond" aria-label="조건 줄" hidden></section>
  <section class="scope" id="scope" aria-label="범위 띠" aria-live="polite" hidden></section>

  <!-- 열린 화면 상단 고리 탭 줄: 맨 왼쪽 [전체 요약] + 다섯 고리 탭(고른 탭의 슬레이트 면이 미끄러져 이동) -->
  <div class="rtabs-wrap" id="rtabs-wrap" hidden>
    <button type="button" class="rtabs-cue is-l" id="rt-cue-l" aria-hidden="true" tabindex="-1" hidden><svg width="8" height="14" viewBox="0 0 8 14"><path d="M7 1L1 7l6 6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <nav class="rtabs is-compact" id="rtabs" role="tablist" aria-label="분석 화면" hidden></nav>
    <button type="button" class="rtabs-cue is-r" id="rt-cue-r" aria-hidden="true" tabindex="-1" hidden><svg width="8" height="14" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
  </div>

  <div id="work-anchor" tabindex="-1"></div>

  <!-- 화면 전환 시 높이를 이어 주는 가로 기준축 다리 -->
  <div class="axis-bridge" id="axis-bridge" aria-hidden="true" hidden></div>

  <!-- 첫 화면(전체 요약): 안개 바탕 위 가로 기준축(62% 지점)과 다섯 기둥 묶음, 아래 결론 한 문장 -->
  <section class="home-panel" id="home-panel" aria-label="전체 결론 요약"></section>

  <!-- 탭 화면 본문 무대: 사각 면 없이 안개 바탕 위에 기준축과 도형이 놓이고, 고른 도형에서 읽기 영역으로 1px 선이 이어진다 -->
  <div class="board" id="board" data-layout="side" hidden>
    <div class="sel-glide" id="sel-glide" aria-hidden="true" hidden>
      <i class="sg-c tl"></i><i class="sg-c tr"></i><i class="sg-c bl"></i><i class="sg-c br"></i>
    </div>
    <svg class="sel-link-svg" id="sel-link" aria-hidden="true" focusable="false">
      <path class="sel-link-p" id="sel-link-p" fill="none" pathLength="1"/>
      <circle class="sel-link-dot" id="sel-link-dot" r="2.5" hidden/>
    </svg>
    <aside class="z-left" id="z-left" aria-label="분류" hidden></aside>
    <main class="z-center" id="z-center" tabindex="-1"></main>
    <aside class="z-right ev" id="z-right" aria-label="고른 것의 상세">
      <div class="ev-unselected" id="ev-unselected"></div>
      <div class="zr-in ev-in" id="zr-in" hidden>
        <i class="ev-handle" aria-hidden="true"></i>
        <div class="ev-top">
          <div class="ev-krow"><span class="k" id="ev-k">요약</span><span class="ev-pnm"><span id="ev-pnm-t">상세와 근거</span><span id="ev-help"></span></span></div>
          <h2 id="ev-t">요약</h2>
          <div class="badges" id="ev-b"></div>
          <button class="ev-x" id="ev-x" type="button" aria-label="상세 닫기"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.8"/></svg></button>
        </div>
        <div class="ev-body" id="ev-body"></div>
        <button class="zr-more" id="zr-more" type="button" hidden></button>
      </div>
    </aside>
  </div>

  <!-- 무대 아래 기능 단추 줄: 왼쪽 [뒤로] [표로 보기 / 문장으로 보기] [요약 복사] [범례], 오른쪽 스킨 및 움직임 전환 -->
  <div class="actbar" id="actbar" role="toolbar" aria-label="화면 조작">
    <div class="actbar-l" id="actbar-l"></div>
    <div class="actbar-r" id="actbar-r">
      <button class="tgl" id="skin" type="button" aria-pressed="false">짙은 화면</button>
      <button class="tgl" id="motion" type="button" aria-pressed="true">움직임 <b>켬</b></button>
    </div>
  </div>

  <footer class="foot" id="foot">
    <p><b id="foot-notice-h">고지.</b> <span id="foot-notice">공모전 시연용 화면이며 영업 자료가 아닙니다</span>. <span id="foot-disclaimer"></span> <span class="asof"><span id="asof-label">자료 기준</span> <span class="num" id="asof"></span></span></p>
    <p><b id="foot-font-h">글꼴.</b> /*__FONT_NOTICE__*/</p>
  </footer>
</div>

<!-- 눌러서 여는 전체 표 및 문장 창(표로 보기, 문장으로 보기) -->
<div class="data-modal" id="data-modal" role="dialog" aria-modal="true" aria-labelledby="dm-title" hidden>
  <div class="dm-scrim" data-modal-close="1"></div>
  <div class="dm-box" role="document">
    <header class="dm-head">
      <div class="dm-hl">
        <span class="dm-k" id="dm-k"></span>
        <h2 class="dm-t" id="dm-title"></h2>
        <div class="dm-b" id="dm-b"></div>
      </div>
      <div class="dm-hr">
        <div class="dm-acts" id="dm-acts"></div>
        <button class="btn sm ghost dm-x" id="dm-x" type="button" data-modal-close="1" aria-label="창 닫기">
          <svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.8"/></svg>
          <span id="dm-x-t">닫기</span>
        </button>
      </div>
    </header>
    <div class="dm-body" id="dm-body"></div>
  </div>
</div>

<div class="aim-reticle" id="aim-reticle" data-shape="rect" aria-hidden="true" hidden>
  <i class="ar-c tl"></i><i class="ar-c tr"></i><i class="ar-c bl"></i><i class="ar-c br"></i>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="help-pop" id="help-pop" role="region" aria-label="풀이 및 범례" hidden></div>
<div class="hud-tip" id="hud-tip" role="tooltip" hidden></div>
<div id="print-root"></div>

<script id="sales-data" type="application/json">/*__SALES__*/</script>
<script id="graph-data" type="application/json">/*__GRAPH__*/</script>
<script>/*__D__*/</script>
<script id="app-bundle" type="text/plain">/*__SCRIPTS__*/</script>
<script>
(function () {
  var skin = null, motion = null;
  try { skin = localStorage.getItem('postlife-c4-skin'); motion = localStorage.getItem('postlife-c4-motion'); } catch (e) {}
  if (skin === 'dark' || skin === 'light') document.documentElement.dataset.theme = skin;
  if (motion !== 'on' && motion !== 'calm' && motion !== 'off') {
    motion = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'calm' : 'on';
  }
  document.documentElement.dataset.motion = motion;
  function runBundle() {
    var el = document.createElement('script');
    el.textContent = document.getElementById('app-bundle').textContent;
    document.body.appendChild(el);
  }
  if (motion === 'off') {
    runBundle();
    return;
  }
  var minWait = motion === 'calm' ? 240 : 600;
  var loader = document.getElementById('boot-loader');
  var arc = document.getElementById('boot-arc');
  var dia = document.getElementById('boot-dia');
  var pct = document.getElementById('boot-pct');
  document.body.classList.add('is-booting');
  loader.hidden = false;
  var t0 = performance.now();
  function setProg(p) {
    if (arc) arc.setAttribute('stroke-dasharray', p + ' 100');
    if (dia) dia.setAttribute('stroke-dasharray', p + ' 100');
    if (pct) pct.textContent = p + '%';
  }
  setProg(14);
  function afterPaint(fn) { requestAnimationFrame(function () { setTimeout(fn, 0); }); }
  afterPaint(function () {
    window.__BOOT_S = JSON.parse(document.getElementById('sales-data').textContent);
    setProg(45);
    afterPaint(function () {
      var m = window.__BOOT_S && window.__BOOT_S['지도'];
      if (m) void Object.keys(m).length;
      setProg(76);
      afterPaint(function () {
        runBundle();
        setProg(100);
        var wait = Math.max(0, minWait - (performance.now() - t0));
        setTimeout(function () {
          loader.classList.add('is-out');
          document.body.classList.remove('is-booting');
          document.body.classList.add('boot-unfold');
          setTimeout(function () {
            loader.hidden = true;
            loader.classList.remove('is-out');
            document.body.classList.remove('boot-unfold');
          }, 280);
        }, wait);
      });
    });
  });
})();
</script>
</body>
</html>
